<script>

const f=x=>r2(x||0).toLocaleString('ru-RU',{maximumFractionDigits:2})+'\u00a0₽',fr=x=>Math.round(x||0).toLocaleString('ru-RU')+'\u00a0₽',pc=x=>(x*100).toFixed(1).replace('.',',')+'%';
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),uid=()=>Math.random().toString(36).slice(2,9);

const D=s=>new Date(s+'T00:00:00'),iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'),today=()=>iso(new Date()),diff=d=>Math.round((D(d)-D(today()))/864e5);

const when=d=>{const k=diff(d);return k<0?'просрочено':k===0?'сегодня':k===1?'завтра':'через '+k+' '+plural(k,'день','дня','дней')};
const dLong=d=>D(d).getDate()+' '+MG[D(d).getMonth()],okDate=s=>/^\d{4}-\d{2}-\d{2}$/.test(s)&&iso(D(s))===s;
const OUT={'Продукты':'🛒','Транспорт':'🚕','Жильё':'🏠','Кафе':'🍽️','Здоровье':'💊','Покупки':'🛍️','Связь':'📱','Развлечения':'🎬','Прочее':'✨'},IN={'Зарплата':'💼','Подработка':'🧾','Купоны':'🏷️','Прочее':'✨'};
const CC=['#00B37E','#3D7BFF','#FFB020','#8B5CF6','#F0644D','#22A7DE','#E85D9E','#14B8A6','#6B7A75'];
const ccol=c=>CC[Math.max(0,Object.keys(OUT).indexOf(c))%9];
const ico=(c,t)=>`<span class="ic" style="background:${t==='out'?ccol(c)+'26':'var(--ac2)'}">${(t==='in'?IN:OUT)[c]||'📈'}</span>`;

/* ---------- bonds: dates, accrued interest, yield (логика из примера) ---------- */
function addM(s,m){const d=D(s),day=d.getDate(),t=new Date(d.getFullYear(),d.getMonth()+m,1),last=new Date(t.getFullYear(),t.getMonth()+1,0).getDate();t.setDate(Math.min(day,last));return iso(t)}
function genDates(first,freq,mat){const st=freq===4?3:freq===12?1:6,out=[];if(!first)return out;for(let i=0;i<80;i++){const d=addM(first,i*st);if(mat&&d>mat)break;out.push(d);if(!mat&&out.length>=20)break}return out}
function settleTs(w){const x=new Date(Date.UTC(w.getFullYear(),w.getMonth(),w.getDate())),wk=()=>[0,6].includes(x.getUTCDay());while(wk())x.setUTCDate(x.getUTCDate()+1);x.setUTCDate(x.getUTCDate()+1);while(wk())x.setUTCDate(x.getUTCDate()+1);return x.getTime()}
const nextCp=p=>(p.dates||[]).find(d=>d>today())||'';
function accrued(p){const nx=nextCp(p);if(!nx||!p.coupon)return 0;const L=p.freq||2,per=L===2?182:L>=12?30:Math.round(365/L),U=s=>Date.UTC(+s.slice(0,4),+s.slice(5,7)-1,+s.slice(8,10)),d=Math.min(per,Math.max(0,(settleTs(new Date())-(U(nx)-per*864e5))/864e5));return r2(r2(p.coupon*d/per)*p.qty)}
function xirr(fl){const npv=r=>fl.reduce((a,x)=>a+x.c/Math.pow(1+r,x.t/365),0);let lo=-.9,hi=5;if(npv(lo)*npv(hi)>0)return null;for(let i=0;i<80;i++){const m=(lo+hi)/2;npv(m)>0?lo=m:hi=m}return(lo+hi)/2}
function flows(p){const T=today(),fl=[];(p.dates||[]).filter(d=>d>T&&(!p.maturity||d<=p.maturity)).forEach(d=>fl.push({t:diff(d),c:p.coupon}));if(p.maturity&&p.maturity>T)fl.push({t:diff(p.maturity),c:p.nominal});return fl}
const ytm=p=>!p.maturity||p.maturity<=today()?null:xirr([{t:0,c:-((p.last||p.price)+accrued(p)/p.qty)},...flows(p)]);

/* ---------- state ---------- */

 S.notify=Object.assign({on:true,credited:true,lead:1},S.notify);S.pos.forEach(p=>{p.proc=p.proc||today();if(!Array.isArray(p.dates))p.dates=[]});S.hide=!!S.hide;
 ['ops','pays','pos','accounts','assets','investments','debts','goals','history'].forEach(k=>{S[k]=(Array.isArray(S[k])?S[k]:[]).filter(x=>x&&typeof x==='object')});
 if(typeof S.paid!=='object')S.paid={};if(typeof S.sent!=='object')S.sent={};
 S.ops=S.ops.filter(o=>typeof o.date==='string'&&isFinite(+o.amt)&&(o.type==='in'||o.type==='out'));
 ['ops','pays','pos','accounts','assets','investments','debts','goals'].forEach(k=>S[k].forEach(x=>{x.id=String(x.id||uid()).replace(/[^\w|-]/g,'')}));
 S.goals.forEach(g=>{g.current=+g.current||0;g.target=+g.target||0});const sk=Object.keys(S.sent);if(sk.length>600)sk.slice(0,sk.length-400).forEach(k=>delete S.sent[k])}
function load(){let j=null;try{j=localStorage.getItem(LK)}catch(e){}try{S=j?JSON.parse(j):{ts:0}}catch(e){try{localStorage.setItem(LK+'_bad',j)}catch(_){}S={ts:0}}if(!S||typeof S!=='object'||Array.isArray(S))S={ts:0};fix()}
let svT=null;function save(){S.ts=Date.now();try{localStorage.setItem(LK,JSON.stringify(S))}catch(e){toast('Не удалось сохранить: память браузера заполнена')}clearTimeout(svT);svT=setTimeout(cloudSave,900)}
const CS=tg&&tg.CloudStorage&&tg.isVersionAtLeast&&tg.isVersionAtLeast('6.9')?tg.CloudStorage:null;
function cloudSave(){if(!CS)return;try{const j=JSON.stringify(S),a=[];for(let i=0;i<j.length;i+=3000)a.push(j.slice(i,i+3000));a.forEach((x,i)=>CS.setItem('d'+i,x));CS.setItem('dn',String(a.length))}catch(e){}}
function cloudLoad(cb){let done=false;const end=v=>{if(!done){done=true;cb(v)}};setTimeout(()=>end(null),2500);try{CS.getItem('dn',(e,v)=>{const k=+v;if(e||!k)return end(null);const ks=[...Array(k)].map((_,i)=>'d'+i);CS.getItems(ks,(e2,o)=>{try{end(JSON.parse(ks.map(x=>o[x]).join('')))}catch(x){end(null)}})})}catch(e){end(null)}}

/* ---------- money ---------- */
const cash=()=>r2(S.bal0+S.ops.reduce((a,o)=>a+(o.type==='in'?o.amt:-o.amt),0));
const bondsVal=()=>S.pos.reduce((a,p)=>a+mkt(p)+accrued(p),0),investmentVal=()=>r2(S.investments.reduce((a,x)=>a+(+x.qty||0)*(+x.currentPrice||0),0));

function auto(){const t=today(),cr=[];S.pos.slice().forEach(p=>{
 (p.dates||[]).filter(d=>d>p.proc&&d<=t&&(!p.maturity||d<=p.maturity)).forEach(d=>{const a=r2(p.coupon*p.qty);if(a<=0)return;const id=uid();S.ops.push({id,date:d,type:'in',amt:a,cat:'Купоны',note:p.name,pid:p.id});cr.push({id,name:p.name,amt:a})});
 if(p.maturity&&p.maturity>p.proc&&p.maturity<=t){const id=uid(),a=r2(p.nominal*p.qty);S.ops.push({id,date:p.maturity,type:'in',amt:a,cat:'Облигации',note:'Погашение: '+p.name,inv:1,pid:p.id});cr.push({id,name:p.name+' (погашение)',amt:a});S.pos=S.pos.filter(x=>x.id!==p.id)}

/* ---------- Moscow Exchange ---------- */
async function mx(path){const r=await fetch('https://iss.moex.com/iss'+path,{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);return r.json()}
const tbl=(j,k)=>{const b=j&&j[k];return b&&b.data?b.data.map(row=>Object.fromEntries(b.columns.map((c,i)=>[c.toLowerCase(),row[i]]))):[]};
async function moexQuote(id){if(!/^[A-Z0-9]{3,20}$/.test(id))throw 0;const j=await mx('/engines/stock/markets/bonds/securities/'+id+'.json?iss.meta=off&iss.only=securities,marketdata&securities.columns=SECID,BOARDID,SHORTNAME,PREVPRICE,FACEVALUE,MATDATE,COUPONVALUE&marketdata.columns=SECID,BOARDID,LAST,MARKETPRICE,WAPRICE');
 const sec=tbl(j,'securities'),md=tbl(j,'marketdata'),s=sec.find(x=>x.boardid==='TQOB')||sec[0];if(!s)throw 0;const m=md.find(x=>x.boardid===s.boardid)||{},pct=m.last||m.marketprice||m.waprice||s.prevprice,face=s.facevalue||1000;if(!pct)throw 0;
 return{name:s.shortname,face,price:r2(pct/100*face),mat:s.matdate&&s.matdate!=='0000-00-00'?s.matdate:'',coupon:s.couponvalue||0}}
async function moexLookup(id){if(!/^[A-Z0-9]{3,20}$/.test(id))throw 0;const [q,j]=await Promise.all([moexQuote(id),mx('/securities/'+id+'/bondization.json?iss.meta=off&iss.only=coupons,amortizations&limit=100')]),cp=tbl(j,'coupons'),am=tbl(j,'amortizations'),T=today();
 const dates=cp.map(x=>x.coupondate).filter(d=>d&&d>T).sort(),next=cp.filter(x=>x.coupondate&&x.coupondate>T).sort((a,b)=>a.coupondate.localeCompare(b.coupondate))[0],cv=next?(next.value_rub??next.value):q.coupon,mat=am.length?am.map(x=>x.amortdate).filter(Boolean).sort().pop():q.mat,per=dates.filter(d=>diff(d)<=365).length;
 return{name:q.name,price:q.price,nominal:q.face,coupon:r2(cv||0),freq:per>=10?12:per>=3?4:2,dates,maturity:mat||''}}
async function refreshPrices(silent){let ok=0,fail=0;for(const p of S.pos){try{if(!p.ticker){fail++;continue}const q=await moexQuote(p.ticker);if(q.price<p.nominal*.3||q.price>p.nominal*1.6){fail++;continue}p.last=q.price;ok++}catch(e){fail++}}
 if(ok){S.pricesAt=Date.now();save()}if(!silent)toast(ok?'Цены обновлены: '+ok+(fail?', не удалось: '+fail:''):'Не удалось получить цены. Укажите тикер облигации');return ok}

const token=()=>{try{return(localStorage.getItem(TK)||'').trim()}catch(e){return''}},chatId=()=>TGID?String(TGID):'',ready=()=>!!(token()&&chatId());
async function send(text){if(!ready())return{ok:false,err:'Нужны токен бота и чат'};try{const r=await fetch('https://api.telegram.org/bot'+token()+'/sendMessage',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({chat_id:chatId(),text,parse_mode:'HTML'})}),j=await r.json();return j.ok?{ok:true}:{ok:false,err:j.description||'Telegram отклонил сообщение'}}catch(e){return{ok:false,err:'Нет связи с Telegram'}}}
async function runNotify(res){const N=S.notify;if(!N.on||!ready())return;let ch=0;const mk=ks=>{ks.forEach(k=>S.sent[k]=1);ch=1};

 if(ch)save()}

const dayN=(a,b)=>Math.round((D(b)-D(a))/864e5);
function bondPlan(p){const T=today(),bd=p.purchaseDate&&okDate(p.purchaseDate)?p.purchaseDate:T,nkd=r2((p.nkdPerBond||0)*p.qty),comm=+p.commission||0,inv=r2(p.price*p.qty+nkd+comm),
 recvOps=S.ops.filter(o=>o.pid===p.id&&o.cat==='Купоны'),recv=r2(recvOps.reduce((a,o)=>a+o.amt,0)),
 fut=(p.dates||[]).filter(d=>d>T&&(!p.maturity||d<=p.maturity)&&p.coupon>0),cpF=r2(fut.length*p.coupon*p.qty),
 hasMat=!!p.maturity&&p.maturity>T,disc=hasMat?r2((p.nominal-p.price)*p.qty):0,

 const fl=[{d:bd,c:-inv},...recvOps.map(o=>({d:o.date,c:o.amt})),...fut.map(d=>({d,c:p.coupon*p.qty}))];if(hasMat)fl.push({d:p.maturity,c:p.nominal*p.qty});
 return{p,bd,inv,nkd,comm,recv,cpF,hasMat,disc,fl,approx,profit:r2(recv+cpF+disc-nkd-comm)}}
function planYield(fl){const s=fl.slice().sort((a,b)=>a.d.localeCompare(b.d));if(s.length<2)return null;const t0=s[0].d;return xirr(s.map(x=>({t:dayN(t0,x.d),c:x.c})))}
const planAgg=L=>({inv:r2(L.reduce((a,x)=>a+x.inv,0)),disc:r2(L.reduce((a,x)=>a+x.disc,0)),recv:r2(L.reduce((a,x)=>a+x.recv,0)),cpF:r2(L.reduce((a,x)=>a+x.cpF,0)),nkd:r2(L.reduce((a,x)=>a+x.nkd,0)),comm:r2(L.reduce((a,x)=>a+x.comm,0)),profit:r2(L.reduce((a,x)=>a+x.profit,0)),fl:L.flatMap(x=>x.fl),approx:L.some(x=>x.approx)});
const sgn=v=>(v>=0?'+':'−')+f(Math.abs(v)),cls=v=>v>=0?'pos':'neg';
function planHtml(a){const y=planYield(a.fl),tot=a.inv?a.profit/a.inv:0,cpNet=r2(a.recv+a.cpF-a.nkd-a.comm);
 return kv('Вложено всего',f(a.inv))+kv('Разница цены покупки и номинала',sgn(a.disc),cls(a.disc))+kv('Купоны уже получено',f(a.recv),'pos')+kv('Купоны ещё ожидаются',f(a.cpF),'pos')+kv('Минус НКД, уплаченный при покупке','−'+f(a.nkd))+kv('Минус комиссии','−'+f(a.comm))

 +kv('Всего получите (купоны и номинал)',f(a.inv+a.profit))+kv('Доходность за весь срок',pc(tot),cls(tot))+kv('Доходность в год',y!=null?pc(y):'—',y!=null?cls(y):'')}

function cfChart(B){const W=320,H=140,pb=20,pt=6,n=B.length,mx=Math.max(1,...B.map(b=>Math.max(b.i,b.o))),gw=(W-16)/n,bw=Math.max(1.5,Math.min(12,gw*.36)),hh=H-pt-pb;let g='';

 else{const lim=addM(now+'-01',-23).slice(0,7);let st=fm<lim?lim:fm;if(st>now)st=now;for(let m=st;m<=now;m=nextYm(m)){const mi=+m.slice(5,7)-1;B.push({k:m,l:MF[mi].slice(0,3)+(mi===0?' '+m.slice(2,4):''),f:MF[mi]+' '+m.slice(0,4),i:0,o:0,s:0})}B.forEach((b,i)=>{b.s=B.length<=12||i%3===0?1:0})}

const ancN=fq=>fq===12?1:fq;
const readAnch=()=>[...document.querySelectorAll('[data-anc]')].map(i=>i.value);
function genFromAnchors(an,fq,mat){const s=[...new Set(an.filter(Boolean))].sort();if(!s.length)return[];if(fq===12)return genDates(s[0],12,mat);const out=[];s.forEach(a=>{for(let i=0;i<40;i++){const d=addM(a,i*12);if(mat&&d>mat)break;out.push(d);if(!mat&&i>=9)break}});return[...new Set(out)].sort().slice(0,mat?400:20)}
function ancErr(an,N,strict){if(an.length<N||an.some(x=>!okDate(x)))return'Укажите все даты выплат';const s=[...new Set(an)].sort();if(s.length<N)return'Даты выплат не должны повторяться';if(strict?s[0]<=today():s[0]<today())return'Даты выплат должны быть в будущем';if(N>1&&s[N-1]>=addM(s[0],12))return'Укажите ближайшие даты: все они должны уместиться в один год';return''}
function buildSched(){const fq=_f.freq,N=ancN(fq),an=readAnch(),mat=$('#fm')?$('#fm').value:'';
 if(an.length<N||an.some(x=>!x))return{err:'Укажите все даты выплат',soft:1};
 const e=ancErr(an,N);if(e)return{err:e};
 const s=[...new Set(an)].sort();
 if(mat&&(!okDate(mat)||mat<s[0]))return{err:'Погашение не раньше ближайшего купона'};
 const ex=_f.ex,same=ex&&ex.freq===fq&&ex.mat===(mat||'')&&JSON.stringify(ex.dates.slice(0,N))===JSON.stringify(s);
 return{ds:same?ex.dates.filter(d=>!mat||d<=mat):genFromAnchors(s,fq,mat)}}
function drawAnc(keep=true){const a=$('#anc'),l=$('#ancl');if(!a)return;if(keep){const c=readAnch();if(c.length)_f.anc=c}
 const N=ancN(_f.freq),v=_f.anc||[];
 l.textContent=N===1?'Дата ближайшей выплаты купона':'Точные даты выплат купона: по одной на каждую выплату в году';
 a.innerHTML='<div class="g2">'+[...Array(N)].map((_,i)=>inp('fa'+i,N===1?'Ближайшая выплата':'Выплата '+(i+1),v[i]||'','date').replace('<input ','<input data-anc="'+i+'" ')).join('')+'</div>'}

 e.innerHTML=sc.err?(sc.soft?'Выберите точные даты выплат. Остальные даты рассчитаются сами, а потом любую из них можно поправить.':'<span class="neg">'+esc(sc.err)+'</span>'):'График: <b>'+sc.ds.length+' '+plural(sc.ds.length,'выплата','выплаты','выплат')+'</b>. Ближайшие: '+sc.ds.slice(0,4).map(d=>dLong(d)+' '+D(d).getFullYear()).join(', ')+(sc.ds.length>4?'…':'')}
