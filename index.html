<style>
:root{--bg:#E9EDF5;--sf:#fff;--ink:#0C1424;--mu:#64708A;--ln:#D8DEEA;--ac:#2A4BFF;--ac2:#E6EAFF;--ok:#0E9F75;--bad:#D13B2C;--sh:0 1px 2px rgba(15,27,69,.06),0 12px 26px -16px rgba(15,27,69,.3);--sans:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;--serif:'IBM Plex Serif',Georgia,'Times New Roman',serif;color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#090E19;--sf:#121A2B;--ink:#E8EDF8;--mu:#8A96AE;--ln:#26324A;--ac:#5B7BFF;--ac2:#1B2650;--ok:#36D3A2;--bad:#FF7A6B;--sh:0 0 0 1px rgba(255,255,255,.05);color-scheme:dark}}
:root[data-theme=dark]{--bg:#090E19;--sf:#121A2B;--ink:#E8EDF8;--mu:#8A96AE;--ln:#26324A;--ac:#5B7BFF;--ac2:#1B2650;--ok:#36D3A2;--bad:#FF7A6B;--sh:0 0 0 1px rgba(255,255,255,.05);color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg)}
body{color:var(--ink);font:15px/1.45 var(--sans);padding-top:env(safe-area-inset-top,0px)}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}

.wrap{max-width:520px;margin:0 auto;padding:16px 18px calc(100px + env(safe-area-inset-bottom,0px))}

h1{font:600 28px/1.15 var(--serif);margin:2px 0 0;letter-spacing:-.015em}
h3{font:600 21px/1.2 var(--serif);margin:2px 0 14px}
.sub{color:var(--mu);font-size:14px;margin-top:3px}
.k{color:var(--mu);font-size:13px}
.money{font-family:var(--serif);font-weight:600;font-variant-numeric:lining-nums tabular-nums;letter-spacing:-.01em}
.pos{color:var(--ok)}.neg{color:var(--bad)}
.hd{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:4px}

.grp{background:var(--sf);border-radius:18px;padding:2px 16px;box-shadow:var(--sh)}
.grp.pad{padding:16px}

/* coupon ticket */
.tw{margin-top:16px}
.ticket{display:flex;align-items:center;gap:16px;background:var(--sf);color:var(--ink);border-radius:22px;padding:16px;box-shadow:var(--sh)}
.ticket .stub{flex:none;width:74px;border-radius:16px;overflow:hidden;background:var(--bg);text-align:center;display:flex;flex-direction:column;align-items:center}

.empty-t{border:1.5px dashed var(--ln);border-radius:14px;padding:20px;margin-top:16px;background:var(--sf)}

.goalbar{margin-top:14px;padding:0 2px}.goalbar .gl{display:flex;justify-content:space-between;font-size:13.5px;color:var(--mu)}.goalbar .gl b{color:var(--ink)}
.gt{height:8px;border-radius:4px;background:var(--ln);margin-top:7px;overflow:hidden}.gt i{display:block;height:100%;border-radius:4px;background:var(--ok)}

/* capital panel */
.panel{position:relative;overflow:hidden;margin-top:18px;padding:20px 20px 14px;border-radius:22px;color:#fff;background:linear-gradient(150deg,#16236A,#0A1232 72%);box-shadow:0 20px 36px -22px rgba(10,18,50,.8)}
.panel::before{content:"";position:absolute;inset:0;background:repeating-radial-gradient(circle at 108% -14%,rgba(255,255,255,.08) 0 1px,transparent 1px 10px);pointer-events:none}
.panel>*{position:relative}
.pk{font-size:13px;opacity:.7}
.cap{font-size:42px;line-height:1.1;margin:4px 0 10px}
.pill{display:inline-block;padding:4px 11px;border-radius:20px;font-size:13px;font-weight:500}

.pst{display:grid;grid-template-columns:repeat(3,1fr);margin-top:18px;padding-top:14px;border-top:1px solid rgba(255,255,255,.16)}

.plink{display:block;margin:8px auto 0;background:none;border:0;color:rgba(255,255,255,.75);font-size:13.5px;padding:6px 10px}
.hint{display:flex;gap:12px;align-items:center;margin-top:16px;padding:12px 14px;background:var(--ac2);border-radius:14px;font-size:14px}
.hint .hi{width:36px;height:36px;border-radius:50%;background:var(--sf);display:grid;place-items:center;color:var(--ac);flex:none}

.amt{font:600 16px var(--serif);text-align:right;white-space:nowrap;font-variant-numeric:lining-nums tabular-nums}

.mh{display:flex;justify-content:space-between;align-items:baseline;margin:24px 4px 8px}
.mh b{font:600 18px var(--serif)}
.seg{display:flex;background:var(--sf);box-shadow:var(--sh);border-radius:14px;padding:4px;margin:16px 0 4px}
.seg button{flex:1;background:none;border:0;padding:9px;font-weight:500;border-radius:10px;color:var(--mu)}
.seg button.on{background:var(--ac);color:#fff}
.tot{display:flex;justify-content:space-between;align-items:baseline;padding:14px 0;border-bottom:1px dashed var(--ln)}
.kv{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:12px 0;border-bottom:1px dashed var(--ln)}.kv:last-child{border-bottom:0}
.kv span{color:var(--mu)}.kv b{font-weight:600;text-align:right;font-variant-numeric:lining-nums tabular-nums}
.kpi{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
.tile{background:var(--sf);border-radius:16px;padding:14px;box-shadow:var(--sh);min-width:0}
.tile span{display:block;font-size:12.5px;color:var(--mu)}.tile b{display:block;font:600 21px/1.2 var(--serif);margin-top:6px;white-space:nowrap}.tile small{display:block;font-size:12.5px;color:var(--mu);margin-top:4px}
.dn{display:flex;align-items:center;gap:18px}.dn svg{flex:none}.dl{flex:1;min-width:0}.dl>div{display:flex;justify-content:space-between;gap:8px;padding:6px 0;font-size:14px}.dl b{font-weight:600}
.sc{width:100%;border-collapse:collapse}.sc th{font-weight:400;color:var(--mu);font-size:12.5px;text-align:right;padding:2px 0 8px}.sc th:first-child,.sc td:first-child{text-align:left}
.sc td{padding:11px 0;text-align:right;border-top:1px dashed var(--ln);font-variant-numeric:lining-nums tabular-nums}.sc td b{font-weight:600}
.yr{display:grid;grid-template-columns:50px 1fr auto;gap:10px;padding:10px 0;border-bottom:1px dashed var(--ln);align-items:baseline}.yr:last-child{border-bottom:0}.yr small{color:var(--mu);font-size:12.5px;display:block;text-align:right}
.ok-t{color:var(--ok);font-weight:500}

/* charts */
.ch svg{width:100%;height:auto;display:block}
.ch text{fill:var(--mu);font:10.5px var(--sans)}
.c0{fill:var(--ac)}.c1{fill:var(--ok)}.c2{fill:var(--ln)}
.ln0{stroke:var(--ac);fill:none;stroke-width:2.8}.ln1{stroke:var(--mu);fill:none;stroke-width:1.6;stroke-dasharray:4 4}.lng{stroke:var(--ok);stroke-width:1.6;stroke-dasharray:5 4}
.leg{display:flex;gap:16px;font-size:12.5px;color:var(--mu);margin-top:8px;flex-wrap:wrap}.leg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px}

/* forms */
.btns{display:flex;gap:10px;margin-top:14px}
.btn{flex:1;height:48px;border:1.5px solid var(--ln);background:var(--sf);border-radius:14px;padding:0 14px;font-weight:600}
.btn.pri{background:var(--ac);border-color:var(--ac);color:#fff;box-shadow:0 10px 18px -10px var(--ac)}
.btn.del{border-color:var(--bad);color:var(--bad)}
.btn:active,.pbtn:active{opacity:.7}
.st{display:flex;align-items:center;gap:8px;font-weight:500;margin:4px 0 2px}
.dot{width:9px;height:9px;border-radius:50%;background:var(--mu)}.dot.on{background:var(--ok)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chips button{border:1.5px solid var(--ln);background:none;border-radius:20px;padding:8px 14px}
.chips button.on{border-color:var(--ac);background:var(--ac);color:#fff}
.chk{display:flex;gap:10px;align-items:center;margin:14px 0 0;font-size:15px;color:var(--ink)}
.chk input{width:22px;height:22px;accent-color:var(--ac);margin:0}
p.note{color:var(--mu);font-size:13.5px;margin:12px 2px 0}
label{display:block;color:var(--mu);font-size:13px;margin:14px 0 5px}
input[type=text],input[type=password],input[type=date],textarea{width:100%;font-size:16px;padding:12px;border:1.5px solid var(--ln);border-radius:12px;background:var(--bg);color:var(--ink)}
input:focus,textarea:focus{border-color:var(--ac);outline:0}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pv{margin-top:16px;padding:12px 0;border-top:1px dashed var(--ln);border-bottom:1px dashed var(--ln)}
.pv .money{font-size:24px}
.sl{margin-bottom:12px}.sl-h{display:flex;justify-content:space-between;align-items:baseline;font-size:14px}.sl-h span{color:var(--mu)}.sl-h b{font:600 17px var(--serif)}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:30px;background:transparent;margin:2px 0 0}
input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:3px;background:var(--ln)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;border-radius:50%;background:#fff;border:2px solid var(--ac);margin-top:-10px;box-shadow:0 3px 8px rgba(0,0,0,.25)}
input[type=range]::-moz-range-track{height:6px;border-radius:3px;background:var(--ln)}
input[type=range]::-moz-range-thumb{width:22px;height:22px;border-radius:50%;background:#fff;border:2px solid var(--ac)}

nav{position:fixed;left:0;right:0;bottom:0;background:color-mix(in srgb,var(--bg) 82%,transparent);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);border-top:1px solid var(--ln);display:flex;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));z-index:5}
nav button{flex:1;min-width:0;background:none;border:0;color:var(--mu);font-size:11px;padding:2px 0;display:flex;flex-direction:column;align-items:center;gap:2px}
nav .ni{width:54px;height:30px;border-radius:15px;display:grid;place-items:center;transition:background .2s}
nav button.on{color:var(--ac);font-weight:600}nav button.on .ni{background:var(--ac2)}
nav svg{width:23px;height:23px}

#sh{position:fixed;inset:0;background:rgba(5,8,15,.55);display:none;align-items:flex-end;z-index:20}
#sh.on{display:flex}
#shb{background:var(--sf);width:100%;max-width:520px;margin:0 auto;border-radius:22px 22px 0 0;padding:10px 20px calc(22px + env(safe-area-inset-bottom,0px));max-height:90vh;overflow:auto;animation:up .22s ease-out}
#shb::before{content:"";display:block;width:38px;height:4px;border-radius:2px;background:var(--ln);margin:0 auto 14px}
@keyframes up{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
.acts{display:flex;gap:10px;margin-top:20px;flex-wrap:wrap}
#toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;z-index:30;display:none;max-width:86vw;text-align:center}
@media(prefers-reduced-motion:reduce){#shb,.fade{animation:none}}
@media(max-width:360px){.cap{font-size:36px}.kpi{gap:8px}}

/* sheets, lists and controls added in the final version */
#shb{position:relative}
.x{position:absolute;right:14px;top:12px;width:34px;height:34px;border-radius:50%;border:0;background:var(--bg);color:var(--mu);font-size:22px;line-height:1}
.x2{border:0;background:none;color:var(--mu);font-size:20px;padding:0;width:28px;height:28px}
.tag{display:inline-block;padding:3px 9px;border-radius:8px;background:var(--ac2);color:var(--ac);font-size:12px;font-weight:600;letter-spacing:.02em}
.big{font-size:32px;margin:6px 0 2px}
.mini{border:0;background:var(--ac);color:#fff;border-radius:12px;padding:9px 14px;font-weight:600;font-size:14px}
.mnav{display:flex;align-items:center;justify-content:space-between;margin:12px 0 0}
.mnav button{border:0;background:var(--sf);box-shadow:var(--sh);width:42px;height:42px;border-radius:14px;font-size:22px;color:var(--ink)}
.mnav .mcur{width:auto;flex:1;margin:0 10px;font:600 17px var(--serif)}
.mtot{margin-top:12px;padding:14px 16px;background:var(--sf);border-radius:18px;box-shadow:var(--sh);display:grid}
.mtot .money{font-size:30px;margin:2px 0}
.toolbar{display:grid;grid-template-columns:1fr 150px;gap:10px;margin-top:14px}
select{width:100%;font-size:15px;padding:12px;border:1.5px solid var(--ln);border-radius:12px;background:var(--sf);color:var(--ink)}
.bcard{display:block;width:100%;text-align:left;background:var(--sf);border:0;border-radius:18px;padding:14px;box-shadow:var(--sh);margin-top:12px;color:inherit}
.bt{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center}
.bm{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px;padding-top:12px;border-top:1px dashed var(--ln)}
.bm span{display:block;font-size:12px;color:var(--mu)}.bm b{font:600 14px var(--serif)}
.ysel{display:flex;align-items:center;gap:6px}.ysel button{border:0;background:var(--sf);box-shadow:var(--sh);width:30px;height:30px;border-radius:10px;color:var(--ink);font-size:18px}.ysel b{min-width:44px;text-align:center}
details.yrs{margin-top:28px}details.yrs summary{cursor:pointer;font:600 18px var(--sans);padding:6px 2px;margin-bottom:8px}
.pk{cursor:pointer}.hit{fill:transparent}
.tk{display:flex;gap:8px}.tk .btn{flex:none;height:46px}.tk input{flex:1}
@media(max-width:360px){.toolbar{grid-template-columns:1fr}}

.mono.st{font-size:12px;letter-spacing:.01em}
.hb .l{display:flex;justify-content:space-between;gap:10px;font-size:14px}.hb .t{height:8px;background:var(--ln);border-radius:4px;margin:6px 0 14px;overflow:hidden}.hb .t i{display:block;height:100%;background:var(--ac);border-radius:4px}.hb>div:last-child .t{margin-bottom:0}
</style></head><body>
<main class="wrap" id="app"></main>
<nav id="nav"></nav>
<div id="sh"><div id="shb"></div></div>
<div id="toast"></div>
<script>
const tg=window.Telegram&&Telegram.WebApp;
const LK='bonds_tg_v1',OLD='bonds_v1',TK='bonds_tg_token',CK='bonds_tg_chat';
const OWNER=0; /* впишите сюда свой Telegram ID: для всех остальных экран будет пустым */
const TGID=tg&&tg.initDataUnsafe&&tg.initDataUnsafe.user?tg.initDataUnsafe.user.id:0;
if(OWNER&&TGID!==OWNER){document.body.innerHTML='';throw 0}
function firstOfMonth(){const d=new Date();return new Date(d.getFullYear(),d.getMonth(),1)}
let S,tab='home',pTab='soon',pfTab='bonds',stQ='',stSort='value',payMonth=firstOfMonth(),statY=new Date().getFullYear(),bondQ='',bondSort='value',_bf={};
const $=s=>document.querySelector(s);
const n=v=>{const x=parseFloat(String(v).replace(/\s/g,'').replace(',','.'));return Number.isFinite(x)?x:0};
const r2=x=>Math.round(x*100)/100;
const f=x=>r2(x||0).toLocaleString('ru-RU',{maximumFractionDigits:2})+'\u00a0₽';
const fr=x=>Math.round(x||0).toLocaleString('ru-RU')+'\u00a0₽';
const sg=x=>(x>=0?'+':'−')+f(Math.abs(x));
const pc=x=>(Math.abs(x)*100).toFixed(1).replace('.',',')+'%';
const pc1=x=>(x*100).toFixed(1).replace('.',',')+'%';
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9);
const MG=['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
const MF=['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
const WD=['вс','пн','вт','ср','чт','пт','сб'];
const D=s=>new Date(s+'T00:00:00');
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const today=()=>iso(new Date());
const diff=d=>Math.round((D(d)-D(today()))/864e5);
const plural=(k,a,b,c)=>{k=Math.abs(k)%100;const m=k%10;return k>10&&k<20?c:m>1&&m<5?b:m===1?a:c};
const when=d=>{const k=diff(d);return k<=0?'сегодня':k===1?'завтра':'через '+k+' '+plural(k,'день','дня','дней')};
const dLong=d=>D(d).getDate()+' '+MG[D(d).getMonth()];
const dShort=d=>D(d).toLocaleDateString('ru-RU');
const okDate=s=>/^\d{4}-\d{2}-\d{2}$/.test(s)&&iso(D(s))===s;
const clone=o=>JSON.parse(JSON.stringify(o));
const sh=x=>{const a=Math.abs(x);return a>=1e6?(x/1e6).toFixed(1).replace('.',',')+'м':a>=1e3?(x/1e3).toFixed(a>=1e4?0:1).replace('.',',')+'т':String(Math.round(x))};
const yl=v=>v+' '+plural(v,'год','года','лет');

/* ---------- dates and accrued interest ---------- */
function addM(s,m){const d=D(s),day=d.getDate(),t=new Date(d.getFullYear(),d.getMonth()+m,1),last=new Date(t.getFullYear(),t.getMonth()+1,0).getDate();t.setDate(Math.min(day,last));return iso(t)}
function genDates(first,freq,mat){const st=freq===4?3:freq===12?1:6,out=[];if(!first)return out;for(let i=0;i<80;i++){const d=addM(first,i*st);if(mat&&d>mat)break;out.push(d);if(!mat&&out.length>=20)break}return out}
function settleTs(w){const x=new Date(Date.UTC(w.getFullYear(),w.getMonth(),w.getDate())),wk=()=>[0,6].includes(x.getUTCDay());while(wk())x.setUTCDate(x.getUTCDate()+1);x.setUTCDate(x.getUTCDate()+1);while(wk())x.setUTCDate(x.getUTCDate()+1);return x.getTime()}
const nextCp=p=>(p.dates||[]).find(d=>d>today())||'';
function accrued(p){const nx=nextCp(p);if(!nx||!p.coupon)return 0;const L=p.freq||2,per=L===2?182:L>=12?30:Math.round(365/L),U=s=>Date.UTC(+s.slice(0,4),+s.slice(5,7)-1,+s.slice(8,10)),d=Math.min(per,Math.max(0,(settleTs(new Date())-(U(nx)-per*864e5))/864e5));return r2(r2(p.coupon*d/per)*p.qty)}

/* ---------- state, storage, Telegram cloud ---------- */
function fix(){S.pos=Array.isArray(S.pos)?S.pos:[];S.log=Array.isArray(S.log)?S.log:[];S.sent=S.sent||{};
 S.notify=Object.assign({on:true,credited:true,lead:1,digest:true},S.notify);
 S.pension=Object.assign({monthly:5000,years:15,rate:0,infl:7,taxRate:13,goal:100000},S.pension);
 S.theme=S.theme||'system';if(S.autoPrices===undefined)S.autoPrices=true;delete S.goal;delete S.tax;
 S.pos.forEach(p=>{p.freq=p.freq||(p.months||[]).length||2;p.coupon=p.coupon||0;p.nominal=p.nominal||1000;
  if(!p.dates||!p.dates.length){const y=new Date().getFullYear(),a=[];(p.months||[]).forEach(m=>{for(let i=0;i<3;i++)a.push(iso(new Date(y+i,m-1,1)))});p.dates=a.sort().filter(d=>!p.maturity||d<=p.maturity)}
  p.proc=p.proc||today()});
 S.stocks=Array.isArray(S.stocks)?S.stocks:[];
 S.stocks.forEach(s=>{s.st=1;s.lot=s.lot||1;s.sector=s.sector||'';s.divs=Array.isArray(s.divs)?s.divs:[];s.hist=Array.isArray(s.hist)?s.hist:[];s.proc=s.proc||today()})}

 try{S=j?JSON.parse(j):{pos:[],log:[],ts:0}}catch(e){S={pos:[],log:[],ts:0}}fix()}
let svT=null;
function save(){S.ts=Date.now();try{localStorage.setItem(LK,JSON.stringify(S))}catch(e){}clearTimeout(svT);svT=setTimeout(cloudSave,900)}
const CS=tg&&tg.CloudStorage&&tg.isVersionAtLeast&&tg.isVersionAtLeast('6.9')?tg.CloudStorage:null;
function cloudSave(){if(!CS)return;try{const j=JSON.stringify(S),parts=[];for(let i=0;i<j.length;i+=3000)parts.push(j.slice(i,i+3000));parts.forEach((x,i)=>CS.setItem('d'+i,x));CS.setItem('dn',String(parts.length))}catch(e){}}
function cloudLoad(cb){let done=false;const end=v=>{if(!done){done=true;cb(v)}};setTimeout(()=>end(null),2500);
 try{CS.getItem('dn',(e,v)=>{const k=+v;if(e||!k)return end(null);const keys=[...Array(k)].map((_,i)=>'d'+i);CS.getItems(keys,(e2,o)=>{try{end(JSON.parse(keys.map(x=>o[x]).join('')))}catch(x){end(null)}})})}catch(e){end(null)}}

/* ---------- money ---------- */
const sm=t=>S.log.filter(e=>e.type===t).reduce((a,e)=>a+e.amount,0);
const contrib=()=>r2(sm('deposit')-sm('withdraw')+S.log.filter(e=>e.type==='buy'&&e.ext).reduce((a,e)=>a+e.amount,0));
const bal=()=>r2(sm('deposit')+sm('coupon')+sm('div')+sm('sell')-sm('withdraw')-S.log.filter(e=>e.type==='buy'&&!e.ext).reduce((a,e)=>a+e.amount,0));
const mkt=p=>(p.last||p.price)*p.qty;
const stMkt=s=>(s.last||s.price)*s.qty;
const asset=id=>S.pos.find(x=>x.id===id)||S.stocks.find(x=>x.id===id);
const capNow=()=>bal()+S.pos.reduce((a,p)=>a+mkt(p)+accrued(p),0)+S.stocks.reduce((a,s)=>a+stMkt(s),0);
const yearly=()=>S.pos.reduce((a,p)=>a+p.coupon*p.freq*p.qty,0);
const taxK=()=>Math.min(1,Math.max(0,n(S.pension.taxRate)/100));
function events(){const out=[],T=today();
 S.pos.forEach(p=>{if(p.qty<=0)return;
  (p.dates||[]).forEach(d=>{if(d>T&&(!p.maturity||d<=p.maturity)&&p.coupon>0)out.push({d,p,a:r2(p.coupon*p.qty),kind:'coupon',key:p.id+'|c|'+d})});
  if(p.maturity&&p.maturity>T)out.push({d:p.maturity,p,a:r2(p.nominal*p.qty),kind:'redemption',key:p.id+'|r|'+p.maturity})});
 S.stocks.forEach(s=>{if(s.qty<=0)return;(s.divs||[]).forEach(d=>{if(!d.paid&&d.date>T)out.push({d:d.date,p:s,a:r2(d.dps*s.qty*(1-taxK())),kind:'dividend',key:s.id+'|d|'+d.id})})});
 const ord={coupon:0,dividend:1,redemption:2};
 return out.sort((a,b)=>a.d.localeCompare(b.d)||ord[a.kind]-ord[b.kind])}

/* coupons are credited on their date, bonds are redeemed at maturity */
function auto(){const t=today(),cp=[],rd=[],dv=[];let ch=false;
 [...S.pos].forEach(p=>{
  (p.dates||[]).filter(d=>d>p.proc&&d<=t&&(!p.maturity||d<=p.maturity)).forEach(d=>{const a=r2(p.coupon*p.qty);if(a<=0)return;const id=uid();S.log.push({id,date:d,type:'coupon',amount:a,pid:p.id,note:p.name,auto:true});cp.push({id,name:p.name,date:d,amount:a});ch=true});
  if(p.maturity&&p.maturity>p.proc&&p.maturity<=t){const id=uid(),a=r2(p.nominal*p.qty);S.log.push({id,date:p.maturity,type:'sell',red:1,amount:a,pid:p.id,bondName:p.name,qty:p.qty,note:'Погашение: '+p.name});rd.push({id,name:p.name,date:p.maturity,amount:a});S.pos=S.pos.filter(x=>x.id!==p.id);ch=true}
  else if(p.proc!==t){p.proc=t;ch=true}});
 S.stocks.forEach(s=>{(s.divs||[]).filter(d=>!d.paid&&d.date>s.proc&&d.date<=t).forEach(d=>{const gross=r2(d.dps*s.qty),tax=r2(gross*taxK()),a=r2(gross-tax),id=uid();if(a<=0)return;S.log.push({id,date:d.date,type:'div',amount:a,gross,tax,pid:s.id,note:s.name});dv.push({id,name:s.name,date:d.date,amount:a});ch=true});if(s.proc!==t){s.proc=t;ch=true}});
 if(ch)save();return{cp,rd,dv}}

 const q=(p.name.match(/\d{4,6}/)||[])[0]||p.name,j=await mx('/securities.json?iss.meta=off&iss.only=securities&securities.columns=secid,shortname,group&q='+encodeURIComponent(q)),L=tbl(j,'securities').filter(x=>x.group==='stock_bonds');
 const L2=/^\d{4,6}$/.test(q)?L.filter(x=>((x.shortname||'')+' '+(x.secid||'')).includes(q)):L,hit=L2.find(x=>/ОФЗ/i.test(x.shortname||''))||L2[0];return hit?hit.secid:null}
async function moexQuote(secid){const j=await mx('/engines/stock/markets/bonds/securities/'+secid+'.json?iss.meta=off&iss.only=securities,marketdata&securities.columns=SECID,BOARDID,SHORTNAME,PREVPRICE,FACEVALUE,ACCRUEDINT,MATDATE,COUPONVALUE&marketdata.columns=SECID,BOARDID,LAST,MARKETPRICE,WAPRICE');
 const sec=tbl(j,'securities'),md=tbl(j,'marketdata'),s=sec.find(x=>x.boardid==='TQOB')||sec[0];if(!s)throw new Error('нет данных');
 const m=md.find(x=>x.boardid===s.boardid)||{},pct=m.last||m.marketprice||m.waprice||s.prevprice,face=s.facevalue||1000;if(!pct)throw new Error('нет цены');
 return{secid,name:s.shortname,face,price:r2(pct/100*face),accrued:s.accruedint||0,mat:s.matdate&&s.matdate!=='0000-00-00'?s.matdate:'',coupon:s.couponvalue||0}}
async function moexLookup(secid){const [q,j]=await Promise.all([moexQuote(secid),mx('/securities/'+secid+'/bondization.json?iss.meta=off&iss.only=coupons,amortizations&limit=100')]),cp=tbl(j,'coupons'),am=tbl(j,'amortizations'),T=today();
 const dates=cp.map(x=>x.coupondate).filter(d=>d&&d>T).sort(),next=cp.filter(x=>x.coupondate&&x.coupondate>T).sort((a,b)=>a.coupondate.localeCompare(b.coupondate))[0],cv=next?(next.value_rub??next.value):q.coupon,
  mat=am.length?am.map(x=>x.amortdate).filter(Boolean).sort().pop():q.mat,per=dates.filter(d=>diff(d)<=365).length;
 return{secid,name:q.name,price:q.price,nominal:q.face,coupon:r2(cv||0),freq:per>=10?12:per>=3?4:2,dates,maturity:mat||'',amort:am.length>1}}
async function stockQuote(secid){const j=await mx('/engines/stock/markets/shares/securities/'+secid.toUpperCase()+'.json?iss.meta=off&iss.only=securities,marketdata&securities.columns=SECID,BOARDID,SHORTNAME,SECNAME,PREVPRICE,LOTSIZE&marketdata.columns=SECID,BOARDID,LAST,MARKETPRICE'),
 sec=tbl(j,'securities'),md=tbl(j,'marketdata'),s=sec.find(x=>x.boardid==='TQBR')||sec[0];if(!s)throw new Error('нет данных');
 const m=md.find(x=>x.boardid===s.boardid)||{},price=m.last||m.marketprice||s.prevprice;if(!price)throw new Error('нет цены');
 return{secid:s.secid,name:s.shortname||s.secname,lot:s.lotsize||1,price:r2(price)}}
async function stockDivs(secid){const j=await mx('/securities/'+secid.toUpperCase()+'/dividends.json?iss.meta=off');return tbl(j,'dividends').filter(x=>x.registryclosedate&&x.value>0).map(x=>({date:x.registryclosedate,dps:x.value})).sort((a,b)=>a.date.localeCompare(b.date))}
async function refreshPrices(silent){let ok=0,fail=0;
 for(const p of S.pos){try{const id=await resolveSecid(p);if(!id){fail++;continue}const q=await moexQuote(id),dg=(p.name.match(/\d{4,6}/)||[])[0];
  if(!p.ticker&&dg&&!((q.name||'')+' '+id).includes(dg)){fail++;continue}
  if(q.price<p.nominal*.3||q.price>p.nominal*1.6){fail++;continue}
  p.last=q.price;if(!p.ticker)p.ticker=id;ok++}catch(e){fail++}}
 for(const s of S.stocks){try{if(!s.ticker){fail++;continue}const q=await stockQuote(s.ticker);if(s.last&&(q.price>s.last*5||q.price<s.last/5)){fail++;continue}s.last=q.price;ok++}catch(e){fail++}}
 if(ok){S.pricesAt=Date.now();save()}
 if(!silent)toast(ok?'Цены обновлены: '+ok+(fail?', не удалось: '+fail:''):'Не удалось получить цены. Введите их вручную в карточке облигации');

async function send(text){if(!ready())return{ok:false,err:'Нужны токен бота и чат'};
 try{const r=await fetch('https://api.telegram.org/bot'+token()+'/sendMessage',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({chat_id:chatId(),text,parse_mode:'HTML',disable_web_page_preview:true})}),j=await r.json();return j.ok?{ok:true}:{ok:false,err:j.description||'Telegram отклонил сообщение'}}catch(e){return{ok:false,err:'Нет связи с Telegram'}}}
async function runNotify(res){const N=S.notify;if(!N.on||!ready())return;let ch=false;const mark=ks=>{ks.forEach(k=>S.sent[k]=1);ch=true};
 const cp=((res&&res.cp)||[]).filter(c=>!S.sent['c'+c.id]),rd=((res&&res.rd)||[]).filter(c=>!S.sent['c'+c.id]),dv=((res&&res.dv)||[]).filter(c=>!S.sent['c'+c.id]);
 if(N.credited&&cp.length){const tot=cp.reduce((a,c)=>a+c.amount,0),r=await send('💰 <b>Купон пришёл</b>\n'+cp.map(c=>esc(c.name)+': <b>+'+f(c.amount)+'</b>').join('\n')+(cp.length>1?'\nВсего: <b>+'+f(tot)+'</b>':'')+'\nНа счёте: '+f(bal()));if(r.ok)mark(cp.map(c=>'c'+c.id))}

 if(N.credited&&dv.length){const tot=dv.reduce((a,c)=>a+c.amount,0),r=await send('💵 <b>Дивиденды пришли</b>\n'+dv.map(c=>esc(c.name)+': <b>+'+f(c.amount)+'</b>').join('\n')+(dv.length>1?'\nВсего: <b>+'+f(tot)+'</b>':'')+'\nНа счёте: '+f(bal()));if(r.ok)mark(dv.map(c=>'c'+c.id))}

  for(const d of Object.keys(byD).sort()){const L=byD[d],tot=L.reduce((a,e)=>a+e.a,0),r=await send('🗓 <b>'+(L.every(e=>e.kind==='redemption')?'Погашение ':L.every(e=>e.kind==='dividend')?'Дивиденды ':'Выплата ')+when(d)+'</b>, '+dLong(d)+'\n'+L.map(e=>esc(e.p.name)+': <b>+'+f(e.a)+'</b> ('+({coupon:'купон',redemption:'номинал',dividend:'дивиденды после налога'})[e.kind]+')').join('\n')+(L.length>1?'\nИтого: <b>+'+f(tot)+'</b>':''));if(r.ok)mark(L.map(e=>e.key))}}
 if(N.digest&&S.pos.length){const now=new Date(),cur=now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0'),key='m'+cur;
  if(!Object.keys(S.sent).some(k=>k[0]==='m')){S.sent[key]=1;ch=true}

/* ---------- analytics ---------- */
function xirr(fl){const npv=r=>fl.reduce((a,x)=>a+x.c/Math.pow(1+r,x.t/365),0);let lo=-.9,hi=5;if(npv(lo)*npv(hi)>0)return null;for(let i=0;i<80;i++){const m=(lo+hi)/2;npv(m)>0?lo=m:hi=m}return(lo+hi)/2}
function flows(p){const T=today(),fl=[];(p.dates||[]).filter(d=>d>T&&(!p.maturity||d<=p.maturity)).forEach(d=>fl.push({t:diff(d),c:p.coupon}));if(p.maturity&&p.maturity>T)fl.push({t:diff(p.maturity),c:p.nominal});return fl}
function ytm(p){if(!p.maturity||p.maturity<=today())return null;return xirr([{t:0,c:-((p.last||p.price)+accrued(p)/p.qty)},...flows(p)])}
function durOf(p,y){let pv=0,w=0;flows(p).forEach(x=>{const t=x.t/365,v=x.c/Math.pow(1+y,t);pv+=v;w+=t*v});return pv?w/pv/(1+y):null}

 const X=x=>pl+(x-x0)/((x1-x0)||1)*(W-pl-pr),Y=y=>H-pb-y/mx*(H-pt-pb),pts=s=>s.p.map(p=>X(p.x).toFixed(1)+','+Y(p.y).toFixed(1)).join(' ');
 let g=`<defs><linearGradient id="lgA" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--ac);stop-opacity:.28"/><stop offset="1" style="stop-color:var(--ac);stop-opacity:0"/></linearGradient></defs>`;
 [.5,1].forEach(k=>{const y=H-pb-k*(H-pt-pb)/1.1;g+=`<line x1="0" x2="${W}" y1="${y.toFixed(1)}" y2="${y.toFixed(1)}" stroke="var(--ln)" stroke-dasharray="2 4"/>`});

/* ---------- pension ---------- */
function penBase(){const v=S.pos.reduce((a,p)=>a+mkt(p),0),w=S.pos.reduce((a,p)=>{const y=ytm(p);return y==null?a:a+y*mkt(p)},0);return v&&w?Math.min(15,Math.max(5,Math.round(w/v*200)/2-3)):12}
function penSim(c,yrs,r,infl){let cap=capNow(),own=cap;const out=[],g=r/12;for(let m=1;m<=yrs*12;m++){cap=cap*(1+g)+c;own+=c;if(m%12===0){const y=m/12,k=Math.pow(1+infl,y);out.push({y,cap,own,inc:cap*g,real:cap*g/k,capReal:cap/k})}}return out}
function penCalc(){const P=S.pension,base=penBase(),rate=Math.min(100,Math.max(0,n(P.rate)>0?n(P.rate):base)),yrs=Math.min(50,Math.max(1,Math.round(n(P.years))||1)),tx=taxK(),infl=Math.min(1,Math.max(-.9,n(P.infl)/100)),c=Math.max(0,n(P.monthly)),r=rate/100*(1-tx),goal=Math.max(0,n(P.goal));
 const rows=penSim(c,yrs,r,infl),last=rows[rows.length-1],cap0=capNow(),g=r/12;
 let reach=null;{let cap=cap0;for(let m=1;m<=600;m++){cap=cap*(1+g)+c;if(cap*g/Math.pow(1+infl,m/12)>=goal){reach=m;break}}}
 let need=0;if(g>0&&goal>0){const N=yrs*12,G=Math.pow(1+g,N),Gn=goal*Math.pow(1+infl,yrs);need=Math.max(0,(Gn/g-cap0*G)/((G-1)/g))}
 const sc=[[Math.max(1,rate-4),'Осторожно'],[rate,'Базовый'],[rate+2,'Оптимистично']].map(([ra,l])=>{const x=penSim(c,yrs,ra/100*(1-tx),infl).pop();return{l,ra,cap:x.cap,real:x.real}});
 return{base,rate,yrs,tx,infl,c,r,goal,rows,last,cap0,reach,need,sc}}
function penHero(){const K=penCalc(),L=K.last,pct=K.goal>0?Math.min(1,L.real/K.goal):0;
 return `<div class="tw"><div class="ticket"><div class="stub"><b class="money">${K.yrs}</b><span>через</span><i>${plural(K.yrs,'год','года','лет')}, ${new Date().getFullYear()+K.yrs}</i></div><div class="tb"><div class="when">Доход в месяц${K.tx?' после налога':''}</div><div class="sum">+${fr(L.inc)}</div><div class="nm">в сегодняшних рублях ${fr(L.real)}</div></div></div></div>
 ${K.goal>0?`<div class="goalbar"><div class="gl"><span>Цель ${fr(K.goal)} в месяц</span><b>${Math.round(pct*100)}%</b></div><div class="gt"><i style="width:${(pct*100).toFixed(1)}%"></i></div></div>`:''}`}
function penRest(){const K=penCalc(),L=K.last,yr0=new Date().getFullYear(),step=Math.ceil(K.yrs/14),yy=K.rows.filter(r=>r.y%step===0||r.y===K.yrs),yw=yl(K.yrs);
 const bs=yy.map(r=>({l:String(yr0+r.y).slice(2),s:[r.own,Math.max(0,r.cap-r.own)],c:[0,1]}));
 const reach=K.reach==null?'более 50 лет':K.reach<=0?'уже достигнута':(Math.floor(K.reach/12)?yl(Math.floor(K.reach/12))+' ':'')+(K.reach%12?K.reach%12+' мес.':'');
 const lines=[{c:'ln0',p:[{x:0,y:K.cap0*K.r/12},...K.rows.map(r=>({x:r.y,y:r.real}))]},{c:'ln1',p:[{x:0,y:K.cap0*K.r/12},...K.rows.map(r=>({x:r.y,y:r.inc}))]}];
 return `<div class="sec"><div class="grp">${kv('Капитал через '+yw,fr(L.cap))}${kv('Ваши деньги',fr(L.own))}${kv('Заработано на купонах',fr(L.cap-L.own),'pos')}${K.goal>0?kv('Цель достигнете через',reach,K.reach==null?'neg':'ok-t'):''}${K.goal>0&&K.reach!==0?kv('Чтобы успеть за '+yw+', в месяц',K.need>0?fr(K.need):'взносы не нужны',K.need>0?'':'ok-t'):''}</div></div>
 <div class="sec"><div class="sec-h"><h2>Рост капитала</h2></div><div class="grp pad">${bars(bs,{h:180,label:'Рост капитала по годам'})}${leg([['ac','ваши деньги'],['ok','заработано']])}</div></div>
 <div class="sec"><div class="sec-h"><h2>Доход в месяц</h2></div><div class="grp pad">${line(lines,{goal:K.goal,xl:['сейчас',String(yr0+K.yrs)],label:'Доход в месяц'})}<div class="leg"><span><i style="background:var(--ac)"></i>в сегодняшних рублях</span><span><i style="background:var(--mu)"></i>в рублях того года</span></div></div></div>
 <div class="sec"><div class="sec-h"><h2>Покупательная способность</h2></div><div class="grp">${kv('Капитал в сегодняшних рублях',fr(L.capReal))}${kv('Рост цен за '+yw,pc1(Math.pow(1+K.infl,K.yrs)-1))}</div></div>
 <div class="sec"><div class="sec-h"><h2>Три сценария</h2></div><div class="grp pad"><table class="sc"><tr><th>Сценарий</th><th>Капитал</th><th>В месяц</th></tr>${K.sc.map(s=>`<tr><td>${s.l}<br><span class="k">${s.ra.toFixed(1).replace('.',',')}% годовых</span></td><td>${fr(s.cap)}</td><td><b>${fr(s.real)}</b></td></tr>`).join('')}</table></div></div>
 <details class="yrs"><summary>Прогноз по годам</summary><div class="grp">${K.rows.map(r=>`<div class="yr"><b>${yr0+r.y}</b><span class="money">${fr(r.cap)}</span><span class="amt">${fr(r.inc)}<small>сегодня ${fr(r.real)}</small></span></div>`).join('')}</div></details>
 <p class="note">Модель: ежемесячные взносы и реинвестирование купонов. Ставка «авто» — доходность портфеля к погашению минус 3 п.п. запаса. Купоны ОФЗ фиксированы, но докупать вы будете по будущим ставкам. Это сценарный расчёт, а не обещание.</p>`}
