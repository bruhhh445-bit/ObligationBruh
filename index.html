<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>ObligationBruh — Купоны ОФЗ</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#F5F7FA">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{
  --bg:#F4F6FA;
  --bg-2:#EAEEF5;
  --sf:#FFFFFF;
  --sf-2:#F8FAFD;
  --ink:#0B1220;
  --ink-2:#1E293B;
  --mu:#6B7280;
  --mu-2:#94A3B8;
  --ln:#E5E9F2;
  --ln-2:#D4DAE6;
  --ac:#4F46E5;
  --ac-2:#6366F1;
  --ac-soft:#EEF0FF;
  --ok:#059669;
  --ok-soft:#E8F7F1;
  --bad:#DC2626;
  --bad-soft:#FDECEC;
  --warn:#D97706;
  --gold:#B45309;
  --sans:'Manrope','Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --mono:'Inter',system-ui,sans-serif;
  --r-sm:10px;
  --r-md:14px;
  --r-lg:20px;
  --r-xl:26px;
  --sh-sm:0 1px 2px rgba(15,23,42,.04),0 1px 3px rgba(15,23,42,.06);
  --sh-md:0 2px 8px rgba(15,23,42,.06),0 4px 16px rgba(15,23,42,.04);
  --sh-lg:0 8px 32px rgba(15,23,42,.10),0 2px 8px rgba(15,23,42,.06);
  color-scheme:light;
}
@media(prefers-color-scheme:dark){
  :root:not([data-theme=light]){
    --bg:#0A0E17;--bg-2:#0E1320;--sf:#141B2A;--sf-2:#1A2233;
    --ink:#F1F5F9;--ink-2:#E2E8F0;--mu:#8B95A8;--mu-2:#64748B;
    --ln:#232D42;--ln-2:#2E3A52;
    --ac:#818CF8;--ac-2:#A5B4FC;--ac-soft:#1E2440;
    --ok:#34D399;--ok-soft:#0E2A22;
    --bad:#F87171;--bad-soft:#2A1414;
    --warn:#FBBF24;--gold:#F59E0B;
    --sh-sm:0 1px 2px rgba(0,0,0,.2),0 1px 3px rgba(0,0,0,.3);
    --sh-md:0 2px 8px rgba(0,0,0,.25),0 4px 16px rgba(0,0,0,.2);
    --sh-lg:0 8px 32px rgba(0,0,0,.35),0 2px 8px rgba(0,0,0,.3);
    color-scheme:dark;
  }
}
:root[data-theme=dark]{
  --bg:#0A0E17;--bg-2:#0E1320;--sf:#141B2A;--sf-2:#1A2233;
  --ink:#F1F5F9;--ink-2:#E2E8F0;--mu:#8B95A8;--mu-2:#64748B;
  --ln:#232D42;--ln-2:#2E3A52;
  --ac:#818CF8;--ac-2:#A5B4FC;--ac-soft:#1E2440;
  --ok:#34D399;--ok-soft:#0E2A22;
  --bad:#F87171;--bad-soft:#2A1414;
  --warn:#FBBF24;--gold:#F59E0B;
  --sh-sm:0 1px 2px rgba(0,0,0,.2),0 1px 3px rgba(0,0,0,.3);
  --sh-md:0 2px 8px rgba(0,0,0,.25),0 4px 16px rgba(0,0,0,.2);
  --sh-lg:0 8px 32px rgba(0,0,0,.35),0 2px 8px rgba(0,0,0,.3);
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);min-height:100%}
body{color:var(--ink);font:14px/1.5 var(--sans);padding-top:env(safe-area-inset-top,0px);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding:16px 18px calc(100px + env(safe-area-inset-bottom,0px))}
h1{font:700 26px/1.2 var(--sans);margin:0;letter-spacing:-.02em}
h2{font:700 17px/1.3 var(--sans);margin:0;letter-spacing:-.01em}
h3{font:700 20px/1.25 var(--sans);margin:0 0 16px;letter-spacing:-.01em}
.k{color:var(--mu);font-size:12.5px;font-weight:500}
.mu{color:var(--mu)}
.money{font-variant-numeric:tabular-nums;letter-spacing:-.01em;font-weight:700}
.pos{color:var(--ok)}
.neg{color:var(--bad)}

/* ---- top bar ---- */
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.top .brand{display:flex;align-items:center;gap:9px}
.logo{width:32px;height:32px;border-radius:9px;background:linear-gradient(135deg,var(--ac),var(--ac-2));display:grid;place-items:center;color:#fff;font-weight:800;font-size:15px;box-shadow:var(--sh-sm)}
.brand-t{font:700 15px var(--sans);letter-spacing:-.01em}
.brand-s{font:500 11px var(--sans);color:var(--mu)}
.gear{width:38px;height:38px;border-radius:11px;background:var(--sf);display:grid;place-items:center;color:var(--ink-2);box-shadow:var(--sh-sm)}

/* ---- hero card ---- */
.hero{position:relative;border-radius:var(--r-xl);padding:22px 22px 20px;color:#fff;overflow:hidden;background:linear-gradient(135deg,#4F46E5 0%,#6366F1 45%,#7C3AED 100%);box-shadow:0 12px 32px -8px rgba(79,70,229,.45)}
.hero::before{content:"";position:absolute;top:-60px;right:-40px;width:180px;height:180px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.18),transparent 70%)}
.hero::after{content:"";position:absolute;bottom:-80px;left:-30px;width:200px;height:200px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.10),transparent 70%)}
.hero>*{position:relative;z-index:1}
.hero .hl{font:500 12.5px var(--sans);opacity:.8;letter-spacing:.02em;text-transform:uppercase}
.hero .cap{font:800 34px/1.1 var(--sans);letter-spacing:-.02em;margin:6px 0 2px;font-variant-numeric:tabular-nums}
.hero .delta{font:600 13.5px var(--sans);display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:20px;background:rgba(255,255,255,.16);margin-top:6px}
.hero .delta.up{background:rgba(52,211,153,.28)}
.hero .delta.dn{background:rgba(248,113,113,.28)}
.hero .foot{display:flex;gap:14px;margin-top:16px;padding-top:14px;border-top:1px solid rgba(255,255,255,.16)}
.hero .foot>div{flex:1;min-width:0}
.hero .foot .k{color:rgba(255,255,255,.7);font-size:11.5px;text-transform:uppercase;letter-spacing:.03em}
.hero .foot b{display:block;font:700 15.5px var(--sans);margin-top:3px;font-variant-numeric:tabular-nums}

/* ---- quick actions ---- */
.qa{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.qa button{background:var(--sf);border-radius:var(--r-md);padding:14px 8px 12px;display:flex;flex-direction:column;align-items:center;gap:7px;box-shadow:var(--sh-sm);font:600 12px var(--sans);color:var(--ink-2);transition:transform .12s,box-shadow .12s}
.qa button:active{transform:scale(.97)}
.qa .qic{width:40px;height:40px;border-radius:12px;background:var(--ac-soft);color:var(--ac);display:grid;place-items:center}
.qa .qic.ok{background:var(--ok-soft);color:var(--ok)}

/* ---- section ---- */
.sec{margin-top:26px}
.sec-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.sec-h h2{font-size:16px}
.link{color:var(--ac);font-weight:600;font-size:13.5px;display:inline-flex;align-items:center;gap:3px;padding:4px 2px}

/* ---- next coupon (hero mini) ---- */
.next{background:var(--sf);border-radius:var(--r-lg);padding:18px;box-shadow:var(--sh-sm);display:flex;gap:14px;align-items:center}
.next .nstub{width:60px;height:60px;border-radius:14px;background:linear-gradient(135deg,var(--ac),var(--ac-2));color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;flex:none;box-shadow:0 6px 16px -4px rgba(79,70,229,.4)}
.next .nstub b{font:800 22px/1 var(--sans)}
.next .nstub span{font:600 10px var(--sans);opacity:.85;margin-top:2px;text-transform:uppercase;letter-spacing:.04em}
.next .nb{flex:1;min-width:0}
.next .nb .k{font-size:11.5px;text-transform:uppercase;letter-spacing:.03em}
.next .nb .sum{font:800 22px var(--sans);margin-top:2px;color:var(--ok)}
.next .nb .nm{font:500 12.5px var(--sans);color:var(--mu);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ---- metrics grid ---- */
.mg{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.mcard{background:var(--sf);border-radius:var(--r-md);padding:14px 15px;box-shadow:var(--sh-sm)}
.mcard .k{font-size:11.5px;text-transform:uppercase;letter-spacing:.03em;color:var(--mu-2);font-weight:600}
.mcard .v{font:700 18px var(--sans);margin-top:5px;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.mcard .v small{font:500 12px var(--sans);color:var(--mu);margin-left:2px}
.mcard .sub{font:500 12px var(--sans);color:var(--mu);margin-top:3px}

/* ---- empty state ---- */
.empty{background:var(--sf);border-radius:var(--r-lg);padding:28px 20px;text-align:center;box-shadow:var(--sh-sm)}
.empty .eic{width:56px;height:56px;border-radius:16px;background:var(--ac-soft);color:var(--ac);display:grid;place-items:center;margin:0 auto 14px}
.empty b{display:block;font:700 16px var(--sans);margin-bottom:6px}
.empty p{color:var(--mu);font-size:13.5px;margin:0 0 16px;line-height:1.5}

/* ---- buttons ---- */
.btn{border-radius:12px;padding:12px 18px;font:600 14px var(--sans);display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:transform .12s,opacity .12s;white-space:nowrap}
.btn:active{transform:scale(.97)}
.btn.pri{background:var(--ac);color:#fff;box-shadow:0 4px 14px -4px rgba(79,70,229,.5)}
.btn.ghost{background:var(--sf);color:var(--ink);box-shadow:var(--sh-sm)}
.btn.soft{background:var(--ac-soft);color:var(--ac)}
.btn.del{background:var(--bad-soft);color:var(--bad)}
.btn.wide{width:100%}
.btns{display:flex;gap:10px;margin-top:16px}
.btns .btn{flex:1}

/* ---- segmented ---- */
.seg{display:inline-flex;background:var(--bg-2);border-radius:12px;padding:4px;gap:2px;width:100%}
.seg button{flex:1;border-radius:9px;padding:9px 12px;font:600 13px var(--sans);color:var(--mu);transition:background .15s,color .15s;white-space:nowrap}
.seg button.on{background:var(--sf);color:var(--ink);box-shadow:var(--sh-sm)}

/* ---- month nav ---- */
.mnav{display:flex;align-items:center;justify-content:space-between;background:var(--sf);border-radius:var(--r-md);padding:8px 10px;box-shadow:var(--sh-sm);margin-top:12px}
.mnav button{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;color:var(--ink-2)}
.mnav button:active{background:var(--bg-2)}
.mnav .mt{font:700 15px var(--sans);text-align:center}
.mnav .mt span{display:block;font:600 11.5px var(--sans);color:var(--ok)}

/* ---- coupon row / card ---- */
.crow{display:flex;gap:12px;align-items:center;padding:13px 15px;background:var(--sf);border-radius:var(--r-md);box-shadow:var(--sh-sm);margin-top:8px;width:100%;text-align:left;transition:transform .12s}
.crow:active{transform:scale(.99)}
.crow .cd{width:44px;height:44px;border-radius:12px;background:var(--bg-2);display:flex;flex-direction:column;align-items:center;justify-content:center;flex:none}
.crow .cd b{font:700 17px/1 var(--sans)}
.crow .cd span{font:600 9.5px var(--sans);color:var(--mu);text-transform:uppercase;margin-top:2px;letter-spacing:.02em}
.crow.got .cd{background:var(--ok-soft)}
.crow.got .cd b{color:var(--ok)}
.crow .cb{flex:1;min-width:0}
.crow .cb b{display:block;font:600 13.5px var(--sans);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.crow .cb span{font:500 12px var(--sans);color:var(--mu)}
.crow .ca{font:700 15px var(--sans);color:var(--ok);white-space:nowrap;font-variant-numeric:tabular-nums}

/* ---- month total ---- */
.mtot{display:flex;justify-content:space-between;align-items:baseline;padding:10px 4px 6px;margin-top:6px}
.mtot span{font:600 12.5px var(--sans);color:var(--mu)}
.mtot b{font:700 16px var(--sans);color:var(--ok);font-variant-numeric:tabular-nums}

/* ---- bond card ---- */
.bcard{background:var(--sf);border-radius:var(--r-lg);padding:16px;box-shadow:var(--sh-sm);margin-top:10px;transition:transform .12s;width:100%;text-align:left}
.bcard:active{transform:scale(.99)}
.bcard .bt{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.bcard .bt b{font:700 15px var(--sans);letter-spacing:-.01em;display:block}
.bcard .bt .ticker{font:600 11px var(--mono);color:var(--mu);background:var(--bg-2);padding:2px 7px;border-radius:6px;margin-top:4px;display:inline-block}
.bcard .bt .val{text-align:right}
.bcard .bt .val b{font:700 16px var(--sans);font-variant-numeric:tabular-nums}
.bcard .bt .val span{font:500 12px var(--sans);color:var(--ok);display:block;margin-top:2px}
.bcard .bg{display:grid;grid-template-columns:1fr 1fr 1fr;gap:1px;margin-top:14px;background:var(--ln);border-radius:10px;overflow:hidden}
.bcard .bg>div{background:var(--sf);padding:10px 8px}
.bcard .bg .k{font-size:10.5px;text-transform:uppercase;letter-spacing:.03em;color:var(--mu-2);font-weight:600}
.bcard .bg .v{font:600 13px var(--sans);margin-top:3px;font-variant-numeric:tabular-nums}
.bcard .bar{height:3px;background:var(--bg-2);border-radius:2px;margin-top:12px;overflow:hidden}
.bcard .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--ac),var(--ac-2));border-radius:2px}

/* ---- search + sort ---- */
.tools{display:flex;gap:8px;margin-top:14px}
.search{flex:1;background:var(--sf);border-radius:12px;display:flex;align-items:center;gap:8px;padding:0 12px;box-shadow:var(--sh-sm)}
.search svg{color:var(--mu-2);flex:none}
.search input{border:0;background:none;outline:0;padding:11px 0;width:100%;font:500 14px var(--sans)}
.icon-btn{width:44px;height:44px;border-radius:12px;background:var(--sf);display:grid;place-items:center;box-shadow:var(--sh-sm);color:var(--ink-2);flex:none}
.icon-btn.on{background:var(--ac);color:#fff}
.sortmenu{display:flex;gap:6px;overflow-x:auto;padding:10px 0 2px;margin:0 -18px 0;padding-left:18px;padding-right:18px;scrollbar-width:none}
.sortmenu::-webkit-scrollbar{display:none}
.sortmenu button{flex:none;padding:8px 14px;border-radius:20px;background:var(--sf);box-shadow:var(--sh-sm);font:600 12.5px var(--sans);color:var(--mu);white-space:nowrap}
.sortmenu button.on{background:var(--ink);color:var(--bg)}

/* ---- stats ---- */
.stat-hero{background:var(--sf);border-radius:var(--r-lg);padding:18px;box-shadow:var(--sh-sm);margin-top:12px}
.stat-hero .big{font:800 28px var(--sans);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.stat-hero .row2{display:flex;gap:16px;margin-top:14px;padding-top:14px;border-top:1px solid var(--ln)}
.stat-hero .row2>div{flex:1}
.stat-hero .row2 .k{font-size:11px;text-transform:uppercase;letter-spacing:.03em}
.stat-hero .row2 b{display:block;font:700 15px var(--sans);margin-top:3px;font-variant-numeric:tabular-nums}
.kv{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:12px 0;border-bottom:1px solid var(--ln)}
.kv:last-child{border-bottom:0}
.kv span{font:500 13.5px var(--sans);color:var(--mu)}
.kv b{font:700 14.5px var(--sans);text-align:right;font-variant-numeric:tabular-nums}
.panel{background:var(--sf);border-radius:var(--r-lg);padding:16px 16px 8px;box-shadow:var(--sh-sm);margin-top:12px}
.panel .kv{padding:10px 0}

/* charts */
.ch{margin:8px 0 0}
.ch svg{width:100%;height:auto;display:block;overflow:visible}
.ch text{fill:var(--mu);font:600 10px var(--sans)}
.ch .bar{transition:opacity .12s}
.ch .bar:active{opacity:.6}
.c0{fill:var(--ac)}.c1{fill:var(--ok)}.c2{fill:var(--ln-2)}.c3{fill:var(--ac-2)}.c4{fill:var(--warn)}
.ln0{stroke:var(--ac);fill:none;stroke-width:2.6;stroke-linejoin:round;stroke-linecap:round}
.ln1{stroke:var(--mu);fill:none;stroke-width:1.6;stroke-dasharray:4 4}
.lng{stroke:var(--ok);stroke-width:1.6;stroke-dasharray:5 4}
.leg{display:flex;gap:14px;font-size:12px;color:var(--mu);margin-top:8px;flex-wrap:wrap;font-weight:500}
.leg i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:6px;vertical-align:middle}
.hbar{margin-top:4px}
.hbar .l{display:flex;justify-content:space-between;gap:10px;font-size:13px;font-weight:600;margin-bottom:5px}
.hbar .l span{color:var(--mu);font-weight:500}
.hbar .t{height:8px;background:var(--bg-2);border-radius:4px;margin:0 0 14px;overflow:hidden}
.hbar .t i{display:block;height:100%;background:linear-gradient(90deg,var(--ac),var(--ac-2));border-radius:4px}

/* ---- pension ---- */
.phero{background:linear-gradient(135deg,#4F46E5,#7C3AED);border-radius:var(--r-xl);padding:22px;color:#fff;box-shadow:0 12px 32px -8px rgba(79,70,229,.45);position:relative;overflow:hidden}
.phero::before{content:"";position:absolute;top:-50px;right:-30px;width:160px;height:160px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.16),transparent 70%)}
.phero>*{position:relative;z-index:1}
.phero .pl{font:500 12px var(--sans);opacity:.8;text-transform:uppercase;letter-spacing:.03em}
.phero .pv{font:800 32px var(--sans);margin:4px 0 2px;letter-spacing:-.02em}
.phero .pr{font:500 13px var(--sans);opacity:.85}
.phero .prow{display:flex;gap:14px;margin-top:16px;padding-top:14px;border-top:1px solid rgba(255,255,255,.18)}
.phero .prow>div{flex:1}
.phero .prow .k{color:rgba(255,255,255,.7);font-size:11px;text-transform:uppercase;letter-spacing:.03em}
.phero .prow b{display:block;font:700 15px var(--sans);margin-top:3px}
.slider-row{margin:14px 0 4px}
.slider-row .sl{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}
.slider-row .sl label{font:600 13px var(--sans);color:var(--ink-2)}
.slider-row .sl b{font:700 14px var(--sans);color:var(--ac)}
input[type=range]{width:100%;-webkit-appearance:none;height:6px;border-radius:3px;background:var(--bg-2);outline:0;margin:0}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:50%;background:var(--ac);border:3px solid var(--sf);box-shadow:var(--sh-md);cursor:pointer}
input[type=range]::-moz-range-thumb{width:20px;height:20px;border-radius:50%;background:var(--ac);border:3px solid var(--sf);box-shadow:var(--sh-md);cursor:pointer}
.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.pgrid .fld{background:var(--sf);border-radius:var(--r-md);padding:12px 14px;box-shadow:var(--sh-sm)}
.pgrid .fld label{font:600 11px var(--sans);text-transform:uppercase;letter-spacing:.03em;color:var(--mu-2);display:block;margin-bottom:5px}
.pgrid .fld input{border:0;background:none;outline:0;width:100%;font:700 16px var(--sans);padding:0;color:var(--ink)}
.pgrid .fld input::placeholder{color:var(--mu-2);font-weight:500;font-size:14px}
.scn{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.scn .s{background:var(--sf);border-radius:var(--r-md);padding:12px;box-shadow:var(--sh-sm);text-align:center}
.scn .s.on{outline:2px solid var(--ac);outline-offset:-1px}
.scn .s .sl{font:600 11px var(--sans);color:var(--mu);text-transform:uppercase;letter-spacing:.02em}
.scn .s .sv{font:700 14px var(--sans);margin-top:6px;font-variant-numeric:tabular-nums}
.scn .s .sp{font:600 11px var(--sans);color:var(--ac);margin-top:2px}
.yr{display:grid;grid-template-columns:48px 1fr auto;gap:10px;padding:10px 0;border-bottom:1px solid var(--ln);align-items:center}
.yr:last-child{border-bottom:0}
.yr b{font:700 13px var(--sans)}
.yr .yv{font:600 13px var(--sans);text-align:right;font-variant-numeric:tabular-nums}
.yr .yi{font:700 13px var(--sans);text-align:right;color:var(--ok);font-variant-numeric:tabular-nums}
.yr small{display:block;font:500 11px var(--sans);color:var(--mu);text-align:right;margin-top:1px}

/* ---- settings ---- */
.sgroup{background:var(--sf);border-radius:var(--r-lg);box-shadow:var(--sh-sm);overflow:hidden;margin-top:12px}
.srow{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--ln);width:100%;text-align:left;background:none}
.srow:last-child{border-bottom:0}
.srow .sic{width:36px;height:36px;border-radius:10px;background:var(--ac-soft);color:var(--ac);display:grid;place-items:center;flex:none}
.srow .sic.ok{background:var(--ok-soft);color:var(--ok)}
.srow .sic.warn{background:#FEF3E2;color:var(--warn)}
.srow .sb{flex:1;min-width:0}
.srow .sb b{display:block;font:600 14px var(--sans)}
.srow .sb span{font:500 12px var(--sans);color:var(--mu)}
.srow .chev{color:var(--mu-2);flex:none}
.dot{width:9px;height:9px;border-radius:50%;background:var(--mu-2);flex:none}
.dot.on{background:var(--ok);box-shadow:0 0 0 3px var(--ok-soft)}
.toggle{position:relative;width:48px;height:28px;border-radius:14px;background:var(--ln-2);transition:background .2s;flex:none}
.toggle.on{background:var(--ac)}
.toggle::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:var(--sh-sm);transition:transform .2s}
.toggle.on::after{transform:translateX(20px)}

label.fld-l{display:block;color:var(--mu);font-size:12px;font-weight:600;margin:14px 0 6px}
input[type=text],input[type=password],input[type=date],textarea{width:100%;font-size:16px;padding:12px 13px;border:1.5px solid var(--ln);border-radius:12px;background:var(--sf);color:var(--ink);font-family:var(--sans);transition:border-color .15s}
input:focus,textarea:focus{border-color:var(--ac);outline:0}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
.chips button{border:1.5px solid var(--ln);background:var(--sf);border-radius:20px;padding:9px 14px;font:600 13px var(--sans);color:var(--mu)}
.chips button.on{border-color:var(--ac);background:var(--ac);color:#fff}

/* ---- nav ---- */
nav{position:fixed;left:0;right:0;bottom:0;background:var(--sf);border-top:1px solid var(--ln);display:flex;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));z-index:5;box-shadow:0 -4px 20px rgba(15,23,42,.04)}
nav button{flex:1;min-width:0;background:none;color:var(--mu);font:600 10px var(--sans);padding:6px 0 4px;display:flex;flex-direction:column;align-items:center;gap:3px;border-radius:12px;transition:color .15s}
nav button.on{color:var(--ac)}
nav button svg{width:22px;height:22px;transition:transform .15s}
nav button.on svg{transform:scale(1.08)}

/* ---- sheet ---- */
#sh{position:fixed;inset:0;background:rgba(5,8,15,.5);display:none;align-items:flex-end;z-index:20;backdrop-filter:blur(3px)}
#sh.on{display:flex}
#shb{background:var(--sf);width:100%;max-width:560px;margin:0 auto;border-radius:24px 24px 0 0;padding:10px 20px calc(24px + env(safe-area-inset-bottom,0px));max-height:92vh;overflow:auto;animation:up .25s cubic-bezier(.2,.8,.2,1);box-shadow:0 -8px 40px rgba(0,0,0,.2)}
#shb::before{content:"";display:block;width:40px;height:4px;border-radius:2px
