<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<title>Купоны ОФЗ</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#EDF0F5">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Serif:wght@500;600&display=swap" rel="stylesheet">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#EDF0F5;--sf:#fff;--ink:#0E1626;--mu:#657084;--ln:#CFD6E2;--ac:#2A4BFF;--ok:#0F8F67;--bad:#C93A2B;--sans:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;--serif:'IBM Plex Serif',Georgia,'Times New Roman',serif;color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0A0F1A;--sf:#131B2B;--ink:#E9EEF8;--mu:#8D99AE;--ln:#27324B;--ac:#5877FF;--ok:#35D3A1;--bad:#FF7A6B;color-scheme:dark}}
:root[data-theme=dark]{--bg:#0A0F1A;--sf:#131B2B;--ink:#E9EEF8;--mu:#8D99AE;--ln:#27324B;--ac:#5877FF;--ok:#35D3A1;--bad:#FF7A6B;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg)}
body{color:var(--ink);font:15px/1.45 var(--sans);padding-top:env(safe-area-inset-top,0px)}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.wrap{max-width:520px;margin:0 auto;padding:18px 20px calc(96px + env(safe-area-inset-bottom,0px))}
h1{font:600 24px/1.2 var(--serif);margin:4px 0 2px;letter-spacing:-.01em}
h3{font:600 20px/1.2 var(--serif);margin:2px 0 14px}
.k{color:var(--mu);font-size:13px}
.money{font-family:var(--serif);font-weight:600;font-variant-numeric:lining-nums tabular-nums;letter-spacing:-.01em}
.pos{color:var(--ok)}.neg{color:var(--bad)}
.sec{margin-top:30px}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:2px}
.sec-h h2{font:600 17px var(--sans);margin:0}
.link{background:none;border:0;color:var(--ac);font-weight:500;padding:6px 0}

/* ticket: the one loud element */
.ticket{display:grid;grid-template-columns:104px 1fr;background:var(--ac);color:#fff;border-radius:10px;margin:10px 0 0;
 -webkit-mask:radial-gradient(circle 9px at 103px 0,#0000 97%,#000) top/100% 51% no-repeat,radial-gradient(circle 9px at 103px 100%,#0000 97%,#000) bottom/100% 51% no-repeat;
 mask:radial-gradient(circle 9px at 103px 0,#0000 97%,#000) top/100% 51% no-repeat,radial-gradient(circle 9px at 103px 100%,#0000 97%,#000) bottom/100% 51% no-repeat}
.ticket .stub{padding:20px 0 20px 18px;border-right:2px dashed rgba(255,255,255,.5);line-height:1}
.ticket .stub b{display:block;font:600 40px var(--serif)}
.ticket .stub span{display:block;margin-top:6px;font-size:14px}
.ticket .stub i{display:block;margin-top:3px;font-style:normal;font-size:12px;opacity:.75}
.ticket .tb{padding:18px 18px 18px 16px;min-width:0}
.ticket .when{font-size:14px;opacity:.85}
.ticket .sum{font:600 30px/1.15 var(--serif);margin-top:4px;font-variant-numeric:lining-nums tabular-nums}
.ticket .nm{font-size:13px;opacity:.85;margin-top:6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.empty-t{border:1.5px dashed var(--ln);border-radius:10px;padding:20px;margin-top:10px}
.empty-t b{display:block;font:600 17px var(--serif);margin-bottom:4px}

.cap{font-size:40px;line-height:1.1;margin:2px 0 4px}
.delta{font-size:14px;font-weight:500}
.stats{display:grid;grid-template-columns:repeat(3,1fr);margin-top:16px;border-top:1px solid var(--ln);border-bottom:1px solid var(--ln)}
.stats>div{padding:12px 0 12px 12px;border-left:1px solid var(--ln);min-width:0}
.stats>div:first-child{border-left:0;padding-left:0}
.stats .money{font-size:16px;margin-top:2px;white-space:nowrap}
.btns{display:flex;gap:10px;margin-top:16px}
.btn{flex:1;border:1.5px solid var(--ink);background:none;border-radius:10px;padding:11px 14px;font-weight:600}
.btn.pri{background:var(--ac);border-color:var(--ac);color:#fff}
.btn.del{border-color:var(--bad);color:var(--bad)}
.btn:active{opacity:.7}
.hint{display:flex;gap:10px;align-items:center;margin-top:18px;padding:12px 0;border-top:1px dashed var(--ln);border-bottom:1px dashed var(--ln);font-size:14px}
.hint svg{flex:none;color:var(--ac)}.hint button{margin-left:auto;white-space:nowrap}

.row{display:grid;grid-template-columns:46px 1fr auto;gap:14px;align-items:center;padding:13px 0;border-bottom:1px dashed var(--ln);width:100%;text-align:left;background:none;border-top:0;border-left:0;border-right:0}
.row:last-child{border-bottom:0}
.dt{text-align:center;line-height:1}
.dt b{display:block;font:600 22px var(--serif)}.dt span{display:block;margin-top:4px;font-size:12px;color:var(--mu)}
.rn{min-width:0}.rn b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rn span{font-size:13px;color:var(--mu)}
.amt{font:600 16px var(--serif);text-align:right;white-space:nowrap;font-variant-numeric:lining-nums tabular-nums}
.amt small{display:block;font:400 12.5px var(--sans);color:var(--mu);margin-top:2px}
.row.got .dt b{color:var(--ok)}
.mh{display:flex;justify-content:space-between;align-items:baseline;margin:26px 0 0;padding-bottom:6px;border-bottom:1.5px solid var(--ink)}
.mh b{font:600 17px var(--serif)}
.seg{display:flex;border:1.5px solid var(--ink);border-radius:10px;overflow:hidden;margin:14px 0 4px}
.seg button{flex:1;background:none;border:0;padding:9px;font-weight:500}
.seg button.on{background:var(--ink);color:var(--bg)}
.tot{display:flex;justify-content:space-between;align-items:baseline;padding:12px 0;border-bottom:1px solid var(--ln)}

/* settings */
.st{display:flex;align-items:center;gap:8px;font-weight:500;margin:4px 0 2px}
.dot{width:9px;height:9px;border-radius:50%;background:var(--mu)}.dot.on{background:var(--ok)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chips button{border:1.5px solid var(--ln);background:none;border-radius:20px;padding:8px 14px}
.chips button.on{border-color:var(--ac);background:var(--ac);color:#fff}
.chk{display:flex;gap:10px;align-items:center;margin:14px 0 0;font-size:15px;color:var(--ink)}
.chk input{width:22px;height:22px;accent-color:var(--ac);margin:0}
p.note{color:var(--mu);font-size:13.5px;margin:10px 0 0}

label{display:block;color:var(--mu);font-size:13px;margin:14px 0 5px}
input[type=text],input[type=password],input[type=date],textarea{width:100%;font-size:16px;padding:11px 12px;border:1.5px solid var(--ln);border-radius:10px;background:var(--bg);color:var(--ink)}
input:focus,textarea:focus{border-color:var(--ac);outline:0}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pv{margin-top:16px;padding:12px 0;border-top:1px dashed var(--ln);border-bottom:1px dashed var(--ln)}
.pv .money{font-size:24px}

nav{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--ln);display:flex;padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));z-index:5}
nav button{flex:1;background:none;border:0;color:var(--mu);font-size:11.5px;padding:6px 0 2px;display:flex;flex-direction:column;align-items:center;gap:3px}
nav button.on{color:var(--ac);font-weight:600}
nav svg{width:24px;height:24px}

#sh{position:fixed;inset:0;background:rgba(5,8,15,.55);display:none;align-items:flex-end;z-index:20}
#sh.on{display:flex}
#shb{background:var(--sf);width:100%;max-width:520px;margin:0 auto;border-radius:18px 18px 0 0;padding:10px 20px calc(22px + env(safe-area-inset-bottom,0px));max-height:90vh;overflow:auto;animation:up .22s ease-out}
#shb::before{content:"";display:block;width:38px;height:4px;border-radius:2px;background:var(--ln);margin:0 auto 14px}
@keyframes up{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
.acts{display:flex;gap:10px;margin-top:20px;flex-wrap:wrap}
#toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;z-index:30;display:none;max-width:86vw;text-align:center}
@media(prefers-reduced-motion:reduce){#shb{animation:none}}
@media(max-width:360px){.ticket{grid-template-columns:92px 1fr}.ticket .stub b{font-size:34px}.cap{font-size:34px}}
</style></head><body>
<main class="wrap" id="app"></main>
<nav id="nav"></nav>
<div id="sh"><div id="shb"></div></div>
<div id="toast"></div>
<script>
const tg=window.Telegram&&Telegram.WebApp;
const LK='bonds_tg_v1',OLD='bonds_v1',TK='bonds_tg_token',CK='bonds_tg_chat';
const SEED={"pos":[],"log":[],"ts":0};
const OWNER=0; /* сюда можно вписать свой Telegram ID: для всех остальных экран будет пустым */
const uid_=tg&&tg.initDataUnsafe&&tg.initDataUnsafe.user?tg.initDataUnsafe.user.id:0;
const LOCKED=OWNER&&uid_!==OWNER;
let S,tab='home',pTab='soon';
const $=s=>document.querySelector(s);
const n=v=>parseFloat(String(v).replace(/\s/g,'').replace(',','.'))||0;
const r2=x=>Math.round(x*100)/100;
const f=x=>r2(x).toLocaleString('ru-RU',{maximumFractionDigits:2})+'\u00a0₽';
const sg=x=>(x>=0?'+':'−')+f(Math.abs(x));
const pc=x=>(Math.abs(x)*100).toFixed(1).replace('.',',')+'%';
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9);
const MG=['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
const MF=['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
const WD=['вс','пн','вт','ср','чт','пт','сб'];
const D=s=>new Date(s+'T00:00:00');
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const today=()=>iso(new Date());
const diff=d=>Math.round((D(d)-D(today()))/864e5);
const plural=(k,a,b,c)=>{k=Math.abs(k)%100;const m=k%10;return k>10&&k<20?c:m>1&&m<5?b:m===1?a:c};
const when=d=>{const k=diff(d);return k<=0?'сегодня':k===1?'завтра':'через '+k+' '+plural(k,'день','дня','дней')};
const dLong=d=>D(d).getDate()+' '+MG[D(d).getMonth()];
const dShort=d=>D(d).toLocaleDateString('ru-RU');
const clone=o=>JSON.parse(JSON.stringify(o));

/* ---------- dates ---------- */
function addM(s,m){const d=D(s),day=d.getDate(),t=new Date(d.getFullYear(),d.getMonth()+m,1),last=new Date(t.getFullYear(),t.getMonth()+1,0).getDate();t.setDate(Math.min(day,last));return iso(t)}
function genDates(first,freq,mat){const st=freq===4?3:freq===12?1:6,out=[];if(!first)return out;for(let i=0;i<80;i++){const d=addM(first,i*st);if(mat&&d>mat)break;out.push(d);if(!mat&&out.length>=20)break}return out}
function settleTs(w){const x=new Date(Date.UTC(w.getFullYear(),w.getMonth(),w.getDate())),wk=()=>[0,6].includes(x.getUTCDay());while(wk())x.setUTCDate(x.getUTCDate()+1);x.setUTCDate(x.getUTCDate()+1);while(wk())x.setUTCDate(x.getUTCDate()+1);return x.getTime()}
const nextCp=p=>(p.dates||[]).find(d=>d>today())||'';
function accrued(p){const nx=nextCp(p);if(!nx||!p.coupon)return 0;const L=p.freq||2,per=L===2?182:L>=12?30:Math.round(365/L),U=s=>Date.UTC(+s.slice(0,4),+s.slice(5,7)-1,+s.slice(8,10)),st=settleTs(new Date()),d=Math.min(per,Math.max(0,(st-(U(nx)-per*864e5))/864e5));return r2(r2(p.coupon*d/per)*p.qty)}

/* ---------- state ---------- */
function fix(){S.pos=S.pos||[];S.log=S.log||[];S.sent=S.sent||{};S.notify=Object.assign({on:true,credited:true,lead:1},S.notify);delete S.goal;delete S.tax;
 S.pos.forEach(p=>{p.freq=p.freq||(p.months||[]).length||2;p.coupon=p.coupon||0;if(!p.dates||!p.dates.length){const y=new Date().getFullYear(),a=[];(p.months||[]).forEach(m=>{for(let i=0;i<3;i++)a.push(iso(new Date(y+i,m-1,1)))});p.dates=a.sort().filter(d=>!p.maturity||d<=p.maturity)}p.proc=p.proc||today()})}
function load(){let j=null;try{j=localStorage.getItem(LK)||localStorage.getItem(OLD)}catch(e){}
 try{S=j?JSON.parse(j):clone(SEED)}catch(e){S=clone(SEED)}fix()}
let st=null;
function save(){S.ts=Date.now();try{localStorage.setItem(LK,JSON.stringify(S))}catch(e){}clearTimeout(st);st=setTimeout(cloudSave,900)}
const CS=tg&&tg.CloudStorage&&tg.isVersionAtLeast&&tg.isVersionAtLeast('6.9')?tg.CloudStorage:null;
function cloudSave(){if(!CS)return;try{const j=JSON.stringify(S),parts=[];for(let i=0;i<j.length;i+=3000)parts.push(j.slice(i,i+3000));parts.forEach((x,i)=>CS.setItem('d'+i,x));CS.setItem('dn',String(parts.length))}catch(e){}}
function cloudLoad(cb){let done=false;const end=v=>{if(!done){done=true;cb(v)}};setTimeout(()=>end(null),2500);
 try{CS.getItem('dn',(e,v)=>{const k=+v;if(e||!k)return end(null);const keys=[...Array(k)].map((_,i)=>'d'+i);CS.getItems(keys,(e2,o)=>{try{end(JSON.parse(keys.map(x=>o[x]).join('')))}catch(x){end(null)}})})}catch(e){end(null)}}

/* ---------- money ---------- */
const sm=t=>S.log.filter(e=>e.type===t).reduce((a,e)=>a+e.amount,0);
const bal=()=>r2(sm('deposit')+sm('coupon')+sm('sell')-sm('withdraw')-S.log.filter(e=>e.type==='buy'&&!e.ext).reduce((a,e)=>a+e.amount,0));
const mkt=p=>(p.last||p.price)*p.qty;
const capNow=()=>bal()+S.pos.reduce((a,p)=>a+mkt(p)+accrued(p),0);
const yearly=()=>S.pos.reduce((a,p)=>a+p.coupon*p.freq*p.qty,0);
const ev=()=>S.pos.flatMap(p=>(p.dates||[]).filter(d=>d>today()&&(!p.maturity||d<=p.maturity)).map(d=>({d,p,a:r2(p.coupon*p.qty)}))).sort((a,b)=>a.d.localeCompare(b.d)||a.p.name.localeCompare(b.p.name));

/* coupons credit to the balance on their date; bonds are redeemed at maturity */
function auto(){const t=today(),got=[];let ch=false;
 [...S.pos].forEach(p=>{
  (p.dates||[]).filter(d=>d>p.proc&&d<=t&&(!p.maturity||d<=p.maturity)).forEach(d=>{const a=r2(p.coupon*p.qty),id=uid();S.log.push({id,date:d,type:'coupon',amount:a,pid:p.id,note:p.name,auto:true});got.push({id,name:p.name,date:d,amount:a});ch=true});
  if(p.maturity&&p.maturity>p.proc&&p.maturity<=t){S.log.push({id:uid(),date:p.maturity,type:'sell',red:1,amount:r2(p.nominal*p.qty),pid:p.id,bondName:p.name,qty:p.qty,note:'Погашение: '+p.name});S.pos=S.pos.filter(x=>x.id!==p.id);ch=true}
  else if(p.proc!==t){p.proc=t;ch=true}});
 if(ch)save();return got}

/* ---------- telegram notifications ---------- */
const token=()=>{try{return(localStorage.getItem(TK)||'').trim()}catch(e){return''}};
const chatId=()=>{try{const m=localStorage.getItem(CK);if(m)return m.trim()}catch(e){}return tg&&tg.initDataUnsafe&&tg.initDataUnsafe.user?String(tg.initDataUnsafe.user.id):''};
const ready=()=>!!(token()&&chatId());
async function send(text){if(!ready())return{ok:false,err:'Нужны токен бота и чат'};
 try{const r=await fetch('https://api.telegram.org/bot'+token()+'/sendMessage',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({chat_id:chatId(),text,parse_mode:'HTML',disable_web_page_preview:true})}),j=await r.json();return j.ok?{ok:true}:{ok:false,err:j.description||'Telegram отклонил сообщение'}}catch(e){return{ok:false,err:'Нет связи с Telegram'}}}
async function runNotify(credited){const N=S.notify;if(!N.on||!ready())return;let ch=false;
 if(N.credited&&credited.length){const fresh=credited.filter(c=>!S.sent['c'+c.id]);
  if(fresh.length){const tot=fresh.reduce((a,c)=>a+c.amount,0),r=await send('💰 <b>Купон пришёл</b>\n'+fresh.map(c=>esc(c.name)+': <b>+'+f(c.amount)+'</b>').join('\n')+(fresh.length>1?'\nВсего: <b>+'+f(tot)+'</b>':'')+'\nНа счёте: '+f(bal()));
   if(r.ok){fresh.forEach(c=>S.sent['c'+c.id]=1);ch=true}}}
 if(N.lead>0){const byD={};ev().filter(e=>diff(e.d)<=N.lead&&!S.sent[e.p.id+'_'+e.d]).forEach(e=>(byD[e.d]=byD[e.d]||[]).push(e));
  for(const d of Object.keys(byD).sort()){const L=byD[d],tot=L.reduce((a,e)=>a+e.a,0),r=await send('🗓 <b>Купон '+when(d)+'</b>, '+dLong(d)+'\n'+L.map(e=>esc(e.p.name)+': <b>+'+f(e.a)+'</b>').join('\n')+(L.length>1?'\nИтого: <b>+'+f(tot)+'</b>':''));
   if(r.ok){L.forEach(e=>S.sent[e.p.id+'_'+e.d]=1);ch=true}}}
 if(ch){save()}}

/* ---------- ui helpers ---------- */
const hap=(t='light')=>{try{tg.HapticFeedback.impactOccurred(t)}catch(e){}};
let tt=null;function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(tt);tt=setTimeout(()=>t.style.display='none',2600)}
const ask=(m,cb)=>{if(tg&&tg.showConfirm&&tg.isVersionAtLeast&&tg.isVersionAtLeast('6.2'))tg.showConfirm(m,ok=>ok&&cb());else if(confirm(m))cb()};
function sheet(h){$('#shb').innerHTML=h;$('#sh').classList.add('on');try{tg.BackButton.show()}catch(e){}}
function closeSheet(){$('#sh').classList.remove('on');try{tg.BackButton.hide()}catch(e){}}
$('#sh').addEventListener('click',e=>{if(e.target.id==='sh')closeSheet()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet()});
const inp=(id,l,v='',t='text',m='decimal')=>`<div><label for="${id}">${l}</label><input id="${id}" type="${t}" ${t==='text'?`inputmode="${m}" autocomplete="off"`:''} value="${esc(v)}"></div>`;
const IC={home:'<path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',pay:'<path d="M4 6h16v14H4zM4 10h16M8 3v4M16 3v4"/>',bonds:'<path d="M6 3h12v18H6zM9 8h6M9 12h6M9 16h4"/>',set:'<path d="M4 7h10M18 7h2M4 17h2M10 17h10M14 5v4M6 15v4"/>',bell:'<path d="M6 17v-6a6 6 0 0 1 12 0v6l2 2H4zM10 21h4"/>'};
const svg=(k,s)=>`<svg viewBox="0 0 24 24" ${s?`width="${s}" height="${s}"`:''} fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">${IC[k]}</svg>`;

/* ---------- views ---------- */
const evRow=(e,i)=>`<div class="row"><div class="dt"><b class="money">${D(e.d).getDate()}</b><span>${MG[D(e.d).getMonth()].slice(0,3)}</span></div><div class="rn"><b>${esc(e.p.name)}</b><span>${e.p.qty} шт., ${when(e.d)}</span></div><div class="amt pos">+${f(e.a)}</div></div>`;

function home(){const E=ev(),B=bal(),cap=capNow(),dep=sm('deposit'),wd=sm('withdraw'),net=dep-wd,g=cap-net,cp=sm('coupon');
 let hero;
 if(E.length){const d=E[0].d,same=E.filter(e=>e.d===d),sum=same.reduce((a,e)=>a+e.a,0);
  hero=`<div class="ticket"><div class="stub"><b class="money">${D(d).getDate()}</b><span>${MG[D(d).getMonth()]}</span><i>${WD[D(d).getDay()]}</i></div><div class="tb"><div class="when">${when(d)}</div><div class="sum">+${f(sum)}</div><div class="nm">${same.map(e=>esc(e.p.name)).join(', ')}</div></div></div>`}
 else hero=`<div class="empty-t"><b>Купонов пока нет</b><span class="k">Добавьте облигацию — выплаты появятся здесь.</span><div class="btns"><button class="btn pri" data-a="add">Добавить облигацию</button></div></div>`;
 const first=E.length?E.filter(e=>e.d===E[0].d).length:0,rest=E.slice(first,first+5);
 return `<h1>Купоны ОФЗ</h1>${hero}
 ${ready()?'':`<div class="hint">${svg('bell',22)}<span>Уведомления в Telegram выключены</span><button class="link" data-a="go" data-id="set">Подключить</button></div>`}
 <div class="sec"><div class="k">Капитал</div><div class="money cap">${f(cap)}</div>
 ${net>0?`<div class="delta ${g>=0?'pos':'neg'}">${g>=0?'▲':'▼'} ${f(Math.abs(g))} (${pc(g/net)}) к вложенному</div>`:''}
 <div class="stats"><div><div class="k">На счёте</div><div class="money">${f(B)}</div></div><div><div class="k">Получено</div><div class="money">${f(cp)}</div></div><div><div class="k">Купоны в год</div><div class="money">${f(yearly())}</div></div></div>
 <div class="btns"><button class="btn pri" data-a="dep">Пополнить</button><button class="btn" data-a="wd">Вывести</button></div>
 <div style="margin-top:6px"><button class="link" data-a="hist">История счёта</button></div></div>
 ${rest.length?`<div class="sec"><div class="sec-h"><h2>Дальше</h2><button class="link" data-a="go" data-id="pay">Все выплаты</button></div>${rest.map(evRow).join('')}</div>`:''}`}

function pay(){let body;
 if(pTab==='soon'){const E=ev().filter(e=>diff(e.d)<=366);if(!E.length)body='<p class="note">Ожидаемых выплат нет.</p>';
  else{const g={};E.forEach(e=>(g[e.d.slice(0,7)]=g[e.d.slice(0,7)]||[]).push(e));
   body=Object.keys(g).sort().map(k=>`<div class="mh"><b>${MF[+k.slice(5)-1]} ${k.slice(0,4)}</b><span class="money">+${f(g[k].reduce((a,e)=>a+e.a,0))}</span></div>${g[k].map(evRow).join('')}`).join('')}}
 else{const L=S.log.filter(e=>e.type==='coupon').sort((a,b)=>b.date.localeCompare(a.date));
  body=L.length?`<div class="tot"><span class="k">Получено всего</span><b class="money pos">+${f(sm('coupon'))}</b></div>`+L.map(e=>`<div class="row got"><div class="dt"><b class="money">${D(e.date).getDate()}</b><span>${MG[D(e.date).getMonth()].slice(0,3)}</span></div><div class="rn"><b>${esc(e.note||'Купон')}</b><span>зачислен на счёт</span></div><div class="amt pos">+${f(e.amount)}</div></div>`).join(''):'<p class="note">Купоны появятся здесь, когда придёт первая выплата.</p>'}
 return `<h1>Выплаты</h1><div class="seg"><button class="${pTab==='soon'?'on':''}" data-a="pt" data-id="soon">Ожидаются</button><button class="${pTab==='got'?'on':''}" data-a="pt" data-id="got">Получено</button></div>${body}`}

function bonds(){const rows=S.pos.map(p=>`<button class="row" style="grid-template-columns:1fr auto" data-a="bond" data-id="${p.id}"><div class="rn"><b>${esc(p.name)}</b><span>${p.qty} шт.${p.maturity?', до '+D(p.maturity).getFullYear()+' г.':''}</span></div><div class="amt">${f(mkt(p))}<small class="pos">+${f(p.coupon*p.freq*p.qty)} в год</small></div></button>`).join('');
 return `<div class="sec-h" style="margin-top:4px"><h1>Облигации</h1><button class="link" data-a="add">Добавить</button></div>${rows||'<p class="note">Портфель пуст. Добавьте первую облигацию.</p>'}`}

function settings(){const N=S.notify,ok=ready(),cid=chatId(),inTg=!!(tg&&tg.initDataUnsafe&&tg.initDataUnsafe.user);
 return `<h1>Настройки</h1>
 <div class="sec"><div class="sec-h"><h2>Уведомления в Telegram</h2></div>
 <div class="st"><span class="dot ${ok&&N.on?'on':''}"></span>${!ok?'Не подключено':N.on?'Включены':'Выключены'}</div>
 <label for="tk">Токен бота (от @BotFather)</label><input id="tk" type="password" autocomplete="off" placeholder="${token()?'токен сохранён на этом устройстве':'123456:ABC…'}">
 ${inTg?`<p class="note">Ваш Telegram ID: ${uid_}. Сообщения придут в этот чат (${esc(cid)}). Откройте бота и нажмите Start, иначе Telegram не даст ему писать.</p>`:inp('ci','ID чата',cid)}
 <label>Предупреждать о купоне заранее</label><div class="chips">${[[0,'Не нужно'],[1,'За 1 день'],[3,'За 3 дня']].map(([v,t])=>`<button data-a="lead" data-id="${v}" class="${N.lead===v?'on':''}">${t}</button>`).join('')}</div>
 <label class="chk"><input type="checkbox" id="nc" ${N.credited?'checked':''}> Сообщать, когда купон пришёл</label>
 <label class="chk"><input type="checkbox" id="non" ${N.on?'checked':''}> Уведомления включены</label>
 <div class="acts"><button class="btn pri" data-a="savetg">Сохранить</button><button class="btn" data-a="testtg">Отправить тест</button></div>
 <p class="note">Сообщения уходят, когда вы открываете приложение: оно проверяет, какие купоны уже пришли или скоро придут. Токен хранится только на этом устройстве.</p></div>
 <div class="sec"><div class="sec-h"><h2>Данные</h2></div><div class="acts" style="margin-top:8px"><button class="btn" data-a="exp">Скопировать данные</button><button class="btn" data-a="imp">Восстановить</button></div>
 <p class="note">${CS?'Данные дублируются в облако Telegram и доступны на всех ваших устройствах.':'Данные хранятся в этом браузере. Скопируйте их, чтобы перенести на другое устройство.'}</p></div>`}

function render(){const y=scrollY;$('#app').innerHTML={home,pay,bonds,set:settings}[tab]();
 $('#nav').innerHTML=[['home','Главная'],['pay','Выплаты'],['bonds','Облигации'],['set','Настройки']].map(([k,l])=>`<button data-a="go" data-id="${k}" class="${tab===k?'on':''}" aria-label="${l}">${svg(k)}${l}</button>`).join('');scrollTo(0,y)}

/* ---------- forms ---------- */
function moneyForm(type){const dep=type==='deposit';sheet(`<h3>${dep?'Пополнить счёт':'Вывести со счёта'}</h3>${inp('ma','Сумма, ₽','')}${inp('md','Дата',today(),'date')}<div class="acts"><button class="btn pri" data-a="savemoney" data-id="${type}">${dep?'Пополнить':'Вывести'}</button></div>`)}
function saveMoney(type){const a=n($('#ma').value);if(a<=0)return toast('Введите сумму');if(type==='withdraw'&&a>bal()+.005)return toast('На счёте только '+f(bal()));
 S.log.push({id:uid(),date:$('#md').value||today(),type,amount:r2(a),note:type==='deposit'?'Пополнение':'Вывод'});save();closeSheet();render();hap('medium')}
function history(){const T={deposit:'Пополнение',withdraw:'Вывод',buy:'Покупка',sell:'Продажа',coupon:'Купон'},L=[...S.log].sort((a,b)=>b.date.localeCompare(a.date)).slice(0,40);
 sheet(`<h3>История счёта</h3><div class="tot"><span class="k">Сейчас на счёте</span><b class="money">${f(bal())}</b></div>`+(L.map(e=>{const plus=['deposit','coupon','sell'].includes(e.type),ext=e.type==='buy'&&e.ext;
  return `<div class="row" style="grid-template-columns:1fr auto;padding:10px 0"><div class="rn"><b>${T[e.type]}${e.bondName?': '+esc(e.bondName):''}${e.qty?' ×'+e.qty:''}</b><span>${dShort(e.date)}${ext?', не с баланса':''}</span></div><div class="amt ${plus?'pos':''}">${plus?'+':'−'}${f(e.amount)}</div></div>`}).join('')||'<p class="note">Операций пока нет.</p>'))}

function bondSheet(id){const p=S.pos.find(x=>x.id===id);if(!p)return;
 sheet(`<h3>${esc(p.name)}</h3><div class="stats" style="margin-top:0"><div><div class="k">Штук</div><div class="money">${p.qty}</div></div><div><div class="k">Средняя цена</div><div class="money">${f(p.price)}</div></div><div><div class="k">Сейчас</div><div class="money">${f(p.last||p.price)}</div></div></div>
 <p class="note">Следующий купон: ${nextCp(p)?dLong(nextCp(p))+', +'+f(p.coupon*p.qty):'нет'}.</p>
 <div class="acts"><button class="btn pri" data-a="buy" data-id="${id}">Докупить</button><button class="btn" data-a="edit" data-id="${id}">Изменить</button><button class="btn del" data-a="del" data-id="${id}">Удалить</button></div>`)}

function preview(ids,out){const upd=()=>{const [q,p,nk,cm]=ids.map(x=>n($('#'+x).value)),clean=q*p;$('#pvt').textContent=f(clean+nk+cm);$('#pvb').textContent='Облигации '+f(clean)+', НКД '+f(nk)+', комиссия '+f(cm)};ids.forEach(x=>$('#'+x).addEventListener('input',upd));upd()}
function buyForm(id){const p=S.pos.find(x=>x.id===id);
 sheet(`<h3>Докупить ${esc(p.name)}</h3><div class="k">На счёте ${f(bal())}</div><div class="g2">${inp('bq','Штук','1','text','numeric')}${inp('bp','Цена за штуку, ₽',p.last||p.price)}${inp('bn','НКД за сделку, ₽','0')}${inp('bc','Комиссия, ₽','0')}</div>
 <div class="pv"><div class="k">К оплате</div><div class="money" id="pvt">—</div><div class="k" id="pvb"></div></div>
 <div class="acts"><button class="btn pri" data-a="savebuy" data-id="${id}">Купить</button></div>`);preview(['bq','bp','bn','bc'])}
function saveBuy(id){const auto_=auto(),p=S.pos.find(x=>x.id===id),q=n($('#bq').value),pr=n($('#bp').value),nk=n($('#bn').value),cm=n($('#bc').value);
 if(q<=0||pr<=0)return toast('Проверьте штуки и цену');const clean=r2(q*pr),total=r2(clean+nk+cm);
 const doit=()=>{p.price=(p.price*p.qty+pr*q)/(p.qty+q);p.qty+=q;p.last=pr;S.log.push({id:uid(),date:today(),type:'buy',amount:total,cleanAmount:clean,nkd:nk,commission:cm,pid:p.id,bondName:p.name,qty:q,price:pr,note:p.name+' ×'+q});save();closeSheet();render();hap('medium')};
 if(total>bal()+.005)ask('На счёте не хватает '+f(total-bal())+'. Всё равно записать покупку?',doit);else doit()}

function bondForm(id){const p=S.pos.find(x=>x.id===id),e=!!p,o=p||{name:'ОФЗ ',price:'',qty:1,nominal:1000,coupon:'',freq:2,maturity:'',buyDate:today(),last:''};
 window._bf={freq:o.freq,next:e?nextCp(p):'',mat:o.maturity||'',fr:o.freq};
 sheet(`<h3>${e?'Изменить облигацию':'Новая облигация'}</h3>${inp('fn','Название',o.name,'text','text')}
 <div class="g2">${inp('fp',e?'Средняя цена, ₽':'Цена за штуку, ₽',o.price)}${inp('fq','Штук',o.qty,'text','numeric')}${e?inp('fl','Текущая цена, ₽',o.last||o.price):''}${inp('fv','Номинал, ₽',o.nominal)}${inp('fc','Купон за выплату, ₽',o.coupon)}</div>
 <label>Выплат в год</label><div class="chips" id="fr">${[[2,'2 раза'],[4,'4 раза'],[12,'12 раз']].map(([v,t])=>`<button type="button" data-a="freq" data-id="${v}" class="${o.freq===v?'on':''}">${t}</button>`).join('')}</div>
 <div class="g2">${inp('fnx','Ближайший купон',e?nextCp(p):'','date')}${inp('fm','Погашение',o.maturity||'','date')}</div>
 ${e?'':`<div class="g2">${inp('fb','Дата покупки',o.buyDate,'date')}<div></div>${inp('fnk','НКД за сделку, ₽','0')}${inp('fcm','Комиссия, ₽','0')}</div><label class="chk"><input type="checkbox" id="fx" checked> Списать покупку с баланса</label><div class="pv"><div class="k">К оплате</div><div class="money" id="pvt">—</div><div class="k" id="pvb"></div></div>`}
 <p class="note">Даты следующих купонов считаются от ближайшего с равным шагом. Если банк сдвинул дату, поправьте её здесь.</p>
 <div class="acts"><button class="btn pri" data-a="savebond" data-id="${id||''}">${e?'Сохранить':'Добавить'}</button></div>`);
 if(!e)preview(['fq','fp','fnk','fcm'])}
function saveBond(id){const e=!!id,p=e?S.pos.find(x=>x.id===id):null,name=$('#fn').value.trim()||'Облигация',price=n($('#fp').value),qty=n($('#fq').value),nom=n($('#fv').value),cp=n($('#fc').value),fr=_bf.freq,nx=$('#fnx').value,mat=$('#fm').value;
 if(qty<=0||price<=0)return toast('Проверьте цену и количество');if(!nx)return toast('Укажите дату ближайшего купона');
 if(e){const changed=nx!==_bf.next||fr!==_bf.fr||mat!==_bf.mat;Object.assign(p,{name,price,qty,nominal:nom,coupon:cp,freq:fr,maturity:mat,last:n($('#fl').value)||p.last});if(changed)p.dates=genDates(nx,fr,mat);
  S.log.forEach(x=>{if(x.pid===p.id&&x.type==='coupon')x.note=name})}
 else{const bd=$('#fb').value||today(),nk=n($('#fnk').value),cm=n($('#fcm').value),clean=r2(price*qty),total=r2(clean+nk+cm),ext=!$('#fx').checked,
  o={id:uid(),name,price,nominal:nom,qty,coupon:cp,freq:fr,maturity:mat,buyDate:bd,last:price,proc:bd,dates:genDates(nx,fr,mat)},
  go=()=>{S.pos.push(o);S.log.push({id:uid(),date:bd,type:'buy',ext,amount:total,cleanAmount:clean,nkd:nk,commission:cm,pid:o.id,bondName:name,qty,price,note:name+' ×'+qty});save();closeSheet();render();hap('medium')};
  if(!ext&&total>bal()+.005)return ask('На счёте не хватает '+f(total-bal())+'. Всё равно записать покупку?',go),void 0;go();return}
 save();closeSheet();render();hap('medium')}

function saveTg(silent){const t=$('#tk').value.trim();try{if(t)localStorage.setItem(TK,t);const ci=$('#ci');if(ci)localStorage.setItem(CK,ci.value.trim())}catch(e){}
 S.notify.credited=$('#nc').checked;S.notify.on=$('#non').checked;save();if(!silent){toast('Сохранено');render()}}
async function testTg(){saveTg(true);if(!ready())return toast('Укажите токен бота');toast('Отправляю…');
 const r=await send('✅ <b>Уведомления подключены</b>\nСюда придут сообщения о купонах по облигациям.');toast(r.ok?'Тест отправлен в Telegram':'Не вышло: '+r.err);render()}
async function copyData(){const j=JSON.stringify(S);try{await navigator.clipboard.writeText(j);toast('Данные скопированы')}catch(e){sheet(`<h3>Копия данных</h3><textarea id="ta" rows="8">${esc(j)}</textarea><div class="acts"><button class="btn" data-a="close">Закрыть</button></div>`);$('#ta').select()}}
function importForm(){sheet(`<h3>Восстановить данные</h3><label for="ta">Вставьте скопированные данные</label><textarea id="ta" rows="8"></textarea><div class="acts"><button class="btn pri" data-a="doimp">Восстановить</button></div>`)}
function doImport(){try{const o=JSON.parse($('#ta').value);if(!Array.isArray(o.pos)||!Array.isArray(o.log))throw 0;ask('Заменить текущие данные скопированными?',()=>{S=o;fix();save();closeSheet();render();toast('Данные восстановлены')})}catch(e){toast('Это не похоже на копию данных')}}

/* ---------- actions ---------- */
const ACT={go:id=>{tab=id;render();scrollTo(0,0);hap()},pt:id=>{pTab=id;render()},dep:()=>moneyForm('deposit'),wd:()=>moneyForm('withdraw'),savemoney:id=>saveMoney(id),hist:history,
 bond:bondSheet,add:()=>bondForm(),edit:id=>bondForm(id),buy:buyForm,savebuy:saveBuy,savebond:saveBond,close:closeSheet,
 del:id=>ask('Удалить облигацию из портфеля? Операции по счёту останутся.',()=>{S.pos=S.pos.filter(x=>x.id!==id);save();closeSheet();render()}),
 freq:(id,b)=>{_bf.freq=+id;b.parentNode.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b))},
 lead:(id,b)=>{S.notify.lead=+id;b.parentNode.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b))},
 savetg:()=>saveTg(),testtg:testTg,exp:copyData,imp:importForm,doimp:doImport};
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b)return;const fn=ACT[b.dataset.a];if(fn)fn(b.dataset.id,b)});

/* ---------- boot ---------- */
function theme(){try{if(tg&&tg.colorScheme)document.documentElement.dataset.theme=tg.colorScheme;const bg=getComputedStyle(document.documentElement).getPropertyValue('--bg').trim();tg.setHeaderColor(bg);tg.setBackgroundColor(bg);tg.setBottomBarColor&&tg.setBottomBarColor(bg)}catch(e){}}
if(tg){try{tg.ready();tg.expand();tg.disableVerticalSwipes&&tg.disableVerticalSwipes();tg.BackButton.onClick(closeSheet);tg.onEvent('themeChanged',theme)}catch(e){}theme()}
if(LOCKED){document.body.innerHTML='';throw 0}
load();render();
{const go=()=>{const c=auto();render();runNotify(c)};
 if(CS)cloudLoad(r=>{if(r&&(r.ts||0)>(S.ts||0)){S=r;fix();try{localStorage.setItem(LK,JSON.stringify(S))}catch(e){}}go()});else go()}
document.addEventListener('visibilitychange',()=>{if(!document.hidden){const c=auto();render();runNotify(c)}});
</script></body></html>
