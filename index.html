<style>

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}

.wrap{max-width:520px;margin:0 auto;padding:14px 16px calc(96px + env(safe-area-inset-bottom,0px))}

.hd{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px}
.gear{width:40px;height:40px;border-radius:50%;border:0;background:var(--sf);box-shadow:var(--sh);display:grid;place-items:center;font-size:18px}
.sec{margin-top:24px}.sec-h{display:flex;justify-content:space-between;align-items:baseline;margin:0 2px 10px}.sec-h h2{font:700 18px var(--f);margin:0}

.grp{background:var(--sf);border-radius:20px;padding:2px 16px;box-shadow:var(--sh)}.grp.pad{padding:16px}
.hero{position:relative;overflow:hidden;border-radius:26px;padding:20px;color:#fff;background:linear-gradient(145deg,#0E5A43,#04211A 78%);box-shadow:0 22px 36px -22px rgba(4,33,26,.9)}
.hero::after{content:"";position:absolute;right:-60px;top:-70px;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,rgba(47,211,155,.35),transparent 70%)}

.hs{display:grid;grid-template-columns:1fr 1fr;padding-top:14px;border-top:1px solid rgba(255,255,255,.16)}

.hb button.w{background:#fff;color:#04211A}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}

.row{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;padding:11px 0;border-bottom:1px solid var(--ln);width:100%;text-align:left;background:none;border-top:0;border-left:0;border-right:0}
.row:last-child{border-bottom:0}
.ic{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-size:20px;background:var(--ac2)}
.dt{width:44px;height:44px;border-radius:14px;background:var(--bg);display:grid;place-content:center;text-align:center;line-height:1.05}
.dt b{font-size:17px;font-weight:800}.dt i{font-style:normal;font-size:10.5px;color:var(--mu)}
.rn{min-width:0}.rn b{display:block;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.rn span{font-size:13px;color:var(--mu)}
.amt{font-weight:800;text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}.amt small{display:block;font:500 12px var(--f);color:var(--mu)}
.pill{display:inline-block;padding:2px 9px;border-radius:20px;font-size:12px;font-weight:700;background:var(--ac2);color:var(--ac)}.pill.r{background:rgba(229,72,77,.14);color:var(--bad)}
.dh{display:flex;justify-content:space-between;margin:20px 4px 8px;font-weight:700}.dh span{color:var(--mu);font-weight:600}
.mnav{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.mnav button{border:0;background:var(--sf);box-shadow:var(--sh);width:42px;height:42px;border-radius:14px;font-size:22px}.mnav b{flex:1;text-align:center;font-size:17px}
.dn{display:flex;align-items:center;gap:16px}.dl{flex:1;min-width:0}
.cb{margin:10px 0}.cb .l{display:flex;justify-content:space-between;font-size:14px}.cb .t{height:7px;background:var(--ln);border-radius:4px;margin-top:5px;overflow:hidden}.cb .t i{display:block;height:100%;border-radius:4px}
.kv{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--ln)}.kv:last-child{border-bottom:0}.kv span{color:var(--mu)}.kv b{font-weight:700;text-align:right}
.empty{border:1.5px dashed var(--ln);border-radius:18px;padding:18px;background:var(--sf)}.empty b{display:block;font-size:17px;margin-bottom:3px}

.btn.pri{background:var(--ac);border-color:var(--ac);color:#04211A}.btn.del{border-color:var(--bad);color:var(--bad)}.btn.sm{height:36px;flex:none;font-size:13px;border-radius:11px}
.acts{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap}
.seg{display:flex;background:var(--sf);box-shadow:var(--sh);border-radius:14px;padding:4px;margin-bottom:12px}.seg button{flex:1;border:0;background:none;padding:9px;border-radius:10px;color:var(--mu);font-weight:700}.seg button.on{background:var(--ac);color:#04211A}
.chips{display:flex;gap:8px;flex-wrap:wrap}.chips button{border:1.5px solid var(--ln);background:none;border-radius:20px;padding:8px 13px;font-weight:600}.chips button.on{border-color:var(--ac);background:var(--ac2);color:var(--ac)}
label{display:block;color:var(--mu);font-size:13px;margin:14px 0 5px}
input[type=text],input[type=password],input[type=date]{width:100%;font-size:16px;padding:12px;border:1.5px solid var(--ln);border-radius:12px;background:var(--bg)}
input:focus{border-color:var(--ac);outline:0}input.big{font:800 30px var(--f);border:0;background:none;padding:6px 0}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.tk{display:flex;gap:8px}.tk input{flex:1}.tk .btn{flex:none;height:46px}
.chk{display:flex;gap:10px;align-items:center;margin:14px 0 0;color:var(--ink);font-size:15px}.chk input{width:22px;height:22px;accent-color:var(--ac);margin:0}
p.note{color:var(--mu);font-size:13px;margin:12px 2px 0}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));background:color-mix(in srgb,var(--bg) 85%,transparent);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);border-top:1px solid var(--ln);z-index:5}

nav .ni{width:52px;height:30px;border-radius:15px;display:grid;place-items:center}nav button.on{color:var(--ink)}nav button.on .ni{background:var(--ac2);color:var(--ac)}nav svg{width:22px;height:22px}
#sh{position:fixed;inset:0;background:rgba(3,8,6,.55);display:none;align-items:flex-end;z-index:20}#sh.on{display:flex}
#shb{position:relative;background:var(--sf);width:100%;max-width:520px;margin:0 auto;border-radius:24px 24px 0 0;padding:12px 20px calc(22px + env(safe-area-inset-bottom,0px));max-height:90vh;overflow:auto}

:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
</style></head><body>
<main class="wrap" id="app"></main><nav id="nav"></nav><div id="sh"><div id="shb"></div></div><div id="toast"></div>
<script>
const tg=window.Telegram&&Telegram.WebApp,LK='fin_v1',TK='fin_tok';
const OWNER=0; /* впишите свой Telegram ID: для остальных экран будет пустым */
const TGID=tg&&tg.initDataUnsafe&&tg.initDataUnsafe.user?tg.initDataUnsafe.user.id:0;
if(OWNER&&TGID!==OWNER){document.body.innerHTML='';throw 0}
const $=s=>document.querySelector(s),n=v=>{const x=parseFloat(String(v).replace(/\s/g,'').replace(',','.'));return isFinite(x)?x:0},r2=x=>Math.round(x*100)/100;
const f=x=>r2(x||0).toLocaleString('ru-RU',{maximumFractionDigits:2})+'\u00a0₽',fr=x=>Math.round(x||0).toLocaleString('ru-RU')+'\u00a0₽',pc=x=>(x*100).toFixed(1).replace('.',',')+'%';
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])),uid=()=>Math.random().toString(36).slice(2,9);
const MF=['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'],MG=['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
const D=s=>new Date(s+'T00:00:00'),iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'),today=()=>iso(new Date()),diff=d=>Math.round((D(d)-D(today()))/864e5);
const plural=(k,a,b,c)=>{k=Math.abs(k)%100;const m=k%10;return k>10&&k<20?c:m>1&&m<5?b:m===1?a:c};
const when=d=>{const k=diff(d);return k<0?'просрочено':k===0?'сегодня':k===1?'завтра':'через '+k+' '+plural(k,'день','дня','дней')};
const dLong=d=>D(d).getDate()+' '+MG[D(d).getMonth()],okDate=s=>/^\d{4}-\d{2}-\d{2}$/.test(s)&&iso(D(s))===s;
const OUT={'Продукты':'🛒','Транспорт':'🚕','Жильё':'🏠','Кафе':'🍽️','Здоровье':'💊','Покупки':'🛍️','Связь':'📱','Развлечения':'🎬','Прочее':'✨'},IN={'Зарплата':'💼','Подработка':'🧾','Купоны':'🏷️','Прочее':'✨'};
const CC=['#00B37E','#3D7BFF','#FFB020','#8B5CF6','#F0644D','#22A7DE','#E85D9E','#14B8A6','#6B7A75'];
const ccol=c=>CC[Math.max(0,Object.keys(OUT).indexOf(c))%9];
const ico=(c,t)=>`<span class="ic" style="background:${t==='out'?ccol(c)+'26':'var(--ac2)'}">${(t==='in'?IN:OUT)[c]||'📈'}</span>`;

/* ---------- bonds: dates, accrued interest, yield (логика из примера) ---------- */
function addM(s,m){const d=D(s),day=d.getDate(),t=new Date(d.getFullYear(),d.getMonth()+m,1),last=new Date(t.getFullYear(),t.getMonth()+1,0).getDate();t.setDate(Math.min(day,last));return iso(t)}
function genDates(first,freq,mat){const st=freq===4?3:freq===12?1:6,out=[];if(!first)return out;for(let i=0;i<80;i++){const d=addM(first,i*st);if(mat&&d>mat)break;out.push(d);if(!mat&&out.length>=20)break}return out}
function settleTs(w){const x=new Date(Date.UTC(w.getFullYear(),w.getMonth(),w.getDate())),wk=()=>[0,6].includes(x.getUTCDay());while(wk())x.setUTCDate(x.getUTCDate()+1);x.setUTCDate(x.getUTCDate()+1);while(wk())x.setUTCDate(x.getUTCDate()+1);return x.getTime()}
const nextCp=p=>(p.dates||[]).find(d=>d>today())||'';
function accrued(p){const nx=nextCp(p);if(!nx||!p.coupon)return 0;const L=p.freq||2,per=L===2?182:L>=12?30:Math.round(365/L),U=s=>Date.UTC(+s.slice(0,4),+s.slice(5,7)-1,+s.slice(8,10)),d=Math.min(per,Math.max(0,(settleTs(new Date())-(U(nx)-per*864e5))/864e5));return r2(r2(p.coupon*d/per)*p.qty)}
function xirr(fl){const npv=r=>fl.reduce((a,x)=>a+x.c/Math.pow(1+r,x.t/365),0);let lo=-.9,hi=5;if(npv(lo)*npv(hi)>0)return null;for(let i=0;i<80;i++){const m=(lo+hi)/2;npv(m)>0?lo=m:hi=m}return(lo+hi)/2}
function flows(p){const T=today(),fl=[];(p.dates||[]).filter(d=>d>T&&(!p.maturity||d<=p.maturity)).forEach(d=>fl.push({t:diff(d),c:p.coupon}));if(p.maturity&&p.maturity>T)fl.push({t:diff(p.maturity),c:p.nominal});return fl}
const ytm=p=>!p.maturity||p.maturity<=today()?null:xirr([{t:0,c:-((p.last||p.price)+accrued(p)/p.qty)},...flows(p)]);
const mkt=p=>(p.last||p.price)*p.qty;

/* ---------- state ---------- */
let S,tab='home',ym=today().slice(0,7),_f={};
function fix(){S.ops=S.ops||[];S.pays=S.pays||[];S.paid=S.paid||{};S.pos=S.pos||[];S.sent=S.sent||{};S.bal0=S.bal0||0;S.theme=S.theme||'system';if(S.autoPrices===undefined)S.autoPrices=true;
 S.notify=Object.assign({on:true,credited:true,lead:1},S.notify);S.pos.forEach(p=>{p.proc=p.proc||today()})}
function load(){let j=null;try{j=localStorage.getItem(LK)}catch(e){}try{S=j?JSON.parse(j):{ts:0}}catch(e){S={ts:0}}fix()}
let svT=null;function save(){S.ts=Date.now();try{localStorage.setItem(LK,JSON.stringify(S))}catch(e){}clearTimeout(svT);svT=setTimeout(cloudSave,900)}
const CS=tg&&tg.CloudStorage&&tg.isVersionAtLeast&&tg.isVersionAtLeast('6.9')?tg.CloudStorage:null;
function cloudSave(){if(!CS)return;try{const j=JSON.stringify(S),a=[];for(let i=0;i<j.length;i+=3000)a.push(j.slice(i,i+3000));a.forEach((x,i)=>CS.setItem('d'+i,x));CS.setItem('dn',String(a.length))}catch(e){}}
function cloudLoad(cb){let done=false;const end=v=>{if(!done){done=true;cb(v)}};setTimeout(()=>end(null),2500);try{CS.getItem('dn',(e,v)=>{const k=+v;if(e||!k)return end(null);const ks=[...Array(k)].map((_,i)=>'d'+i);CS.getItems(ks,(e2,o)=>{try{end(JSON.parse(ks.map(x=>o[x]).join('')))}catch(x){end(null)}})})}catch(e){end(null)}}

/* ---------- money ---------- */
const cash=()=>r2(S.bal0+S.ops.reduce((a,o)=>a+(o.type==='in'?o.amt:-o.amt),0));
const bondsVal=()=>S.pos.reduce((a,p)=>a+mkt(p)+accrued(p),0),capital=()=>cash()+bondsVal();
const inM=k=>S.ops.filter(o=>o.date.slice(0,7)===k&&!o.inv);
const sumT=(L,t)=>L.filter(o=>o.type===t).reduce((a,o)=>a+o.amt,0);
const dueDate=(m,k)=>{const dim=new Date(+k.slice(0,4),+k.slice(5,7),0).getDate();return k+'-'+String(Math.min(m.day,dim)).padStart(2,'0')};
const nextYm=k=>addM(k+'-01',1).slice(0,7);
function payInfo(m){const k=today().slice(0,7),d=dueDate(m,k),paid=!!S.paid[m.id+'|'+k];return paid?{d:dueDate(m,nextYm(k)),paid:true,k:nextYm(k)}:{d,paid:false,k}}
const restPays=()=>S.pays.map(m=>({m,i:payInfo(m)})).filter(x=>!x.i.paid&&x.i.d.slice(0,7)===today().slice(0,7)).reduce((a,x)=>a+x.m.amt,0);
function bondEvents(){const out=[],T=today();S.pos.forEach(p=>{(p.dates||[]).forEach(d=>{if(d>T&&(!p.maturity||d<=p.maturity)&&p.coupon>0)out.push({d,name:p.name,a:r2(p.coupon*p.qty),key:p.id+'|c|'+d,kind:'Купон'})});if(p.maturity&&p.maturity>T)out.push({d:p.maturity,name:p.name,a:r2(p.nominal*p.qty),key:p.id+'|r|'+p.maturity,kind:'Погашение'})});return out.sort((a,b)=>a.d.localeCompare(b.d))}
const upcoming=()=>[...bondEvents(),...S.pays.map(m=>{const i=payInfo(m);return{d:i.d,name:m.name,a:m.amt,pay:1,key:'p'+m.id+i.d,kind:i.d<today()?'Просрочен платёж':'Платёж',cat:m.cat}})].sort((a,b)=>a.d.localeCompare(b.d));
function auto(){const t=today(),cr=[];S.pos.slice().forEach(p=>{
 (p.dates||[]).filter(d=>d>p.proc&&d<=t&&(!p.maturity||d<=p.maturity)).forEach(d=>{const a=r2(p.coupon*p.qty);if(a<=0)return;const id=uid();S.ops.push({id,date:d,type:'in',amt:a,cat:'Купоны',note:p.name,pid:p.id});cr.push({id,name:p.name,amt:a})});
 if(p.maturity&&p.maturity>p.proc&&p.maturity<=t){const id=uid(),a=r2(p.nominal*p.qty);S.ops.push({id,date:p.maturity,type:'in',amt:a,cat:'Облигации',note:'Погашение: '+p.name,inv:1,pid:p.id});cr.push({id,name:p.name+' (погашение)',amt:a});S.pos=S.pos.filter(x=>x.id!==p.id)}
 else p.proc=t});if(cr.length)save();return{cr}}

/* ---------- Moscow Exchange ---------- */
async function mx(path){const r=await fetch('https://iss.moex.com/iss'+path,{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);return r.json()}
const tbl=(j,k)=>{const b=j&&j[k];return b&&b.data?b.data.map(row=>Object.fromEntries(b.columns.map((c,i)=>[c.toLowerCase(),row[i]]))):[]};
async function moexQuote(id){const j=await mx('/engines/stock/markets/bonds/securities/'+id+'.json?iss.meta=off&iss.only=securities,marketdata&securities.columns=SECID,BOARDID,SHORTNAME,PREVPRICE,FACEVALUE,MATDATE,COUPONVALUE&marketdata.columns=SECID,BOARDID,LAST,MARKETPRICE,WAPRICE');
 const sec=tbl(j,'securities'),md=tbl(j,'marketdata'),s=sec.find(x=>x.boardid==='TQOB')||sec[0];if(!s)throw 0;const m=md.find(x=>x.boardid===s.boardid)||{},pct=m.last||m.marketprice||m.waprice||s.prevprice,face=s.facevalue||1000;if(!pct)throw 0;
 return{name:s.shortname,face,price:r2(pct/100*face),mat:s.matdate&&s.matdate!=='0000-00-00'?s.matdate:'',coupon:s.couponvalue||0}}
async function moexLookup(id){const [q,j]=await Promise.all([moexQuote(id),mx('/securities/'+id+'/bondization.json?iss.meta=off&iss.only=coupons,amortizations&limit=100')]),cp=tbl(j,'coupons'),am=tbl(j,'amortizations'),T=today();
 const dates=cp.map(x=>x.coupondate).filter(d=>d&&d>T).sort(),next=cp.filter(x=>x.coupondate&&x.coupondate>T).sort((a,b)=>a.coupondate.localeCompare(b.coupondate))[0],cv=next?(next.value_rub??next.value):q.coupon,mat=am.length?am.map(x=>x.amortdate).filter(Boolean).sort().pop():q.mat,per=dates.filter(d=>diff(d)<=365).length;
 return{name:q.name,price:q.price,nominal:q.face,coupon:r2(cv||0),freq:per>=10?12:per>=3?4:2,dates,maturity:mat||''}}
async function refreshPrices(silent){let ok=0,fail=0;for(const p of S.pos){try{if(!p.ticker){fail++;continue}const q=await moexQuote(p.ticker);if(q.price<p.nominal*.3||q.price>p.nominal*1.6){fail++;continue}p.last=q.price;ok++}catch(e){fail++}}
 if(ok){S.pricesAt=Date.now();save()}if(!silent)toast(ok?'Цены обновлены: '+ok+(fail?', не удалось: '+fail:''):'Не удалось получить цены. Укажите тикер облигации');return ok}

/* ---------- Telegram notifications ---------- */
const token=()=>{try{return(localStorage.getItem(TK)||'').trim()}catch(e){return''}},chatId=()=>TGID?String(TGID):'',ready=()=>!!(token()&&chatId());
async function send(text){if(!ready())return{ok:false,err:'Нужны токен бота и чат'};try{const r=await fetch('https://api.telegram.org/bot'+token()+'/sendMessage',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({chat_id:chatId(),text,parse_mode:'HTML'})}),j=await r.json();return j.ok?{ok:true}:{ok:false,err:j.description||'Telegram отклонил сообщение'}}catch(e){return{ok:false,err:'Нет связи с Telegram'}}}
async function runNotify(res){const N=S.notify;if(!N.on||!ready())return;let ch=0;const mk=ks=>{ks.forEach(k=>S.sent[k]=1);ch=1};
 const cr=((res&&res.cr)||[]).filter(c=>!S.sent[c.id]);
 if(N.credited&&cr.length){const r=await send('💰 <b>Пришли выплаты по облигациям</b>\n'+cr.map(c=>esc(c.name)+': <b>+'+f(c.amt)+'</b>').join('\n')+'\nСвободно: <b>'+f(cash())+'</b>');if(r.ok)mk(cr.map(c=>c.id))}
 if(N.lead>=0)for(const e of upcoming().filter(e=>diff(e.d)>=0&&diff(e.d)<=N.lead&&!S.sent[e.key])){const r=await send((e.pay?'🗓 <b>Платёж ':'🏷 <b>'+e.kind+' ')+when(e.d)+'</b>, '+dLong(e.d)+'\n'+esc(e.name)+': <b>'+(e.pay?'−':'+')+f(e.a)+'</b>');if(r.ok)mk([e.key])}
 if(ch)save()}

function donut(items,tot){const R=54,C=2*Math.PI*R;let off=0,g='';items.forEach(it=>{const sh=it.v/tot*C,L=Math.max(0,sh-(items.length>1?3:0));g+=`<circle cx="70" cy="70" r="${R}" fill="none" stroke="${it.c}" stroke-width="16" stroke-dasharray="${L.toFixed(2)} ${(C-L).toFixed(2)}" stroke-dashoffset="${(-off).toFixed(2)}" transform="rotate(-90 70 70)"/>`;off+=sh});
 return `<svg viewBox="0 0 140 140" width="130" height="130" role="img" aria-label="Траты по категориям">${g}<text x="70" y="68" text-anchor="middle" style="font:800 15px var(--f);fill:var(--ink)">${fr(tot)}</text><text x="70" y="84" text-anchor="middle" style="font:11px var(--f);fill:var(--mu)">расходы</text></svg>`}

function saveBond(){const name=$('#fn').value.trim(),ticker=($('#ft').value||'').trim().toUpperCase(),price=n($('#fp').value),qty=n($('#fq').value),nom=n($('#fv').value),cp=n($('#fc').value),fq=_f.freq,nx=$('#fnx').value,mat=$('#fm').value,bd=$('#fb').value||today(),nk=n($('#fnk').value),cm=n($('#fcm').value);
 if(!name||!Number.isInteger(qty)||qty<=0||price<=0||nom<=0||cp<0||nk<0||cm<0)return toast('Проверьте название, количество, цену, номинал, купон, НКД и комиссию');
 if(!okDate(nx)||nx<today())return toast('Укажите ближайший купон: дата не в прошлом');if(mat&&(!okDate(mat)||mat<nx))return toast('Погашение не раньше ближайшего купона');if(!okDate(bd))return toast('Проверьте дату покупки');
 const ex=_f.ex&&_f.ex.dates[0]===nx&&_f.ex.freq===fq&&_f.ex.mat===mat,ds=ex?_f.ex.dates.filter(d=>!mat||d<=mat):genDates(nx,fq,mat),total=r2(price*qty+nk+cm),o={id:uid(),name,ticker,price,nominal:nom,qty,coupon:cp,freq:fq,maturity:mat,last:price,proc:bd>today()?today():bd,dates:ds},
 go=()=>{S.pos.push(o);if($('#fx').checked)S.ops.push({id:uid(),date:bd,type:'out',amt:total,cat:'Облигации',note:name+' ×'+qty,inv:1,pid:o.id});save();closeSheet();render();hap('medium')};

function bondSheet(id){const p=S.pos.find(x=>x.id===id);if(!p)return;const y=ytm(p),nx=nextCp(p),paid=S.ops.filter(o=>o.pid===id&&o.cat==='Купоны').reduce((a,o)=>a+o.amt,0),fc=bondEvents().filter(e=>e.key.startsWith(id+'|c')).reduce((a,e)=>a+e.a,0);
 sheet(`<h3>${esc(p.name)}</h3><div class="cap" style="font-size:30px;margin:0">${f(mkt(p))}</div><div class="k">${p.qty} шт. по рыночной цене</div><div class="grp" style="margin-top:14px">${kv('Средняя цена',f(p.price))}${kv('Текущая цена',f(p.last||p.price))}${kv('К погашению',y!=null?pc(y)+' годовых':'—')}${kv('Купон',f(p.coupon)+', '+p.freq+' '+plural(p.freq,'раз','раза','раз')+' в год')}${kv('Следующая выплата',nx?dLong(nx)+', +'+f(p.coupon*p.qty):'нет')}${kv('Получено купонов',f(paid),'pos')}${kv('Осталось купонов',f(fc))}${p.maturity?kv('Вернётся '+dLong(p.maturity)+' '+D(p.maturity).getFullYear(),f(p.nominal*p.qty)):''}</div>
 <div class="acts"><button class="btn pri" data-a="sell" data-id="${id}">Продать</button><button class="btn del" data-a="delbond" data-id="${id}">Удалить</button></div>`)}

function saveSell(){const p=S.pos.find(x=>x.id===_f.id),q=n($('#sq').value),pr=n($('#sp').value),nk=n($('#sn').value),cm=n($('#sc').value);if(!p||!Number.isInteger(q)||q<=0||q>p.qty||pr<=0||nk<0||cm<0)return toast('Проверьте количество, цену, НКД и комиссию');
 S.ops.push({id:uid(),date:today(),type:'in',amt:r2(Math.max(0,q*pr+nk-cm)),cat:'Облигации',note:'Продажа: '+p.name+' ×'+q,inv:1,pid:p.id});p.qty-=q;if(p.qty<=0)S.pos=S.pos.filter(x=>x.id!==p.id);save();closeSheet();render();hap('medium')}
